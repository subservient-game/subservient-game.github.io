function applyCostume(c){
  if (typeof c==='string') c = {preset:c};
  const base = COST[c.preset] || {};
  const m = {...base, ...c};
  const isF=H.kind==='f';
  H.lastCostume = c;
  const lk = H.look||{}, useLook = !c.preset || c.preset==='pajamas';
  const skin = normColor(c.skin)||normColor(lk.skin)||normColor(m.skin)||SKIN;
  const outfit = m.outfit==='@skin'?skin:(normColor(c.outfit)||(useLook&&normColor(lk.outfit))||normColor(base.outfit)||(isF?'#3f9a8c':'#d9a93b'));
  const pants = m.pants==='@skin'?skin:(normColor(c.pants)||(useLook&&normColor(lk.pants))||normColor(base.pants)||'#8fa9c9');
  setColors(outfit, pants, skin);
  const fill=s=>sanitizeSVG(String(s||'').replace(/@INITIAL/g, esc((H.name||'H')[0].toUpperCase())));
  J.cHat.innerHTML=fill(m.hat); J.cFace.innerHTML=fill(m.face);
  J.cTorso.innerHTML=fill(isF ? (m.torsoF||m.torso) : (m.torsoM||m.torso));
  J.cBack.innerHTML=fill(m.back);
  J.hairBack.style.display = J.hairFront.style.display = m.hideHair ? 'none' : '';
  J.cardi.style.display = m.hideCardi ? 'none' : '';
  [J.thL2,J.thR2].forEach(e=>e.style.display = (pants!=='#8fa9c9') ? 'none' : '');
  holG.querySelectorAll('#knL > rect:nth-child(2), #knR > rect:nth-child(2)').forEach(e=>e.style.display = (pants!=='#8fa9c9') ? 'none' : '');
  H.costume = c.preset && COST[c.preset] ? c.preset : 'custom';
  if (c.preset==='pajamas' && !c.outfit && !c.hat) H.costume='pajamas';
  try { applyStyle(holG, J, useLook ? (H.look||{}) : {freckles:(H.look||{}).freckles, eyes:(H.look||{}).eyes}, H.kind); } catch(e){}
}

/* SVG sanitizer for costumes / spawned objects written by Claude */
const SAFE_TAGS = new Set(['g','path','rect','circle','ellipse','line','polyline','polygon','text','tspan','lineargradient','radialgradient','stop','defs']);
function sanitizeSVG(str){
  if (!str) return '';
  str=String(str).slice(0,9000);
  const doc = new DOMParser().parseFromString(`<svg xmlns="http://www.w3.org/2000/svg">${str}</svg>`, 'image/svg+xml');
  if (doc.querySelector('parsererror')) return '';
  const root=doc.documentElement;
  (function walk(node){
    for (const ch of [...node.children]){
      if (!SAFE_TAGS.has(ch.tagName.toLowerCase())) { ch.remove(); continue; }
      for (const a of [...ch.attributes]){
        const n=a.name.toLowerCase(), v=a.value.toLowerCase();
        if (n.startsWith('on') || n.includes('href') || (n==='style' && (v.includes('url(')&&!v.includes('url(#') || v.includes('expression') || v.includes('javascript'))) || v.includes('javascript:')) ch.removeAttribute(a.name);
      }
      walk(ch);
    }
  })(root);
  return [...root.childNodes].map(n=>new XMLSerializer().serializeToString(n)).join('').replace(/ xmlns="http:\/\/www\.w3\.org\/2000\/svg"/g,'');
}

const cur = {...N}; let tgt={...N};
let pose=POSES.idle, poseStart=performance.now(), last=performance.now();
function setPose(nameOrPose, face){
  const p = typeof nameOrPose==='object' ? nameOrPose : (POSES[nameOrPose]||POSES.idle);
  pose=p; H.pose = typeof nameOrPose==='string' && POSES[nameOrPose] ? nameOrPose : 'custom'; poseStart=performance.now();
  setFace(face || p.face || ((p===POSES.idle||p===POSES.drink) && typeof moodFace==='function' ? moodFace() : 'normal'));
}
function samplePose(p, t){
  const fr=p.frames, n=fr.length; if(n===1) return fr[0];
  if (p.once){ const total=p.dur*(n-1); if(t>=total) return fr[n-1]; const i=Math.floor(t/p.dur), f=(t%p.dur)/p.dur; return mix(fr[i],fr[i+1],ease(f)); }
  const i=Math.floor(t/p.dur)%n, f=(t%p.dur)/p.dur, j=(i+1)%n;

}
const ease=f=>(1-Math.cos(Math.PI*f))/2;

let blinkT=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  tgt={...samplePose(pose, now-poseStart)};
  if (H.seat && !pose.lie){ Object.assign(tgt, SIT); const sl=OBJ[H.seat].seat.legs; if (sl) Object.assign(tgt, sl); }
  if (H.lying && pose.lie){ const L=OBJ[H.lying].lie; if (L&&L.bend){ tgt.kL=L.bend; tgt.kR=L.bend; tgt.lL=2; tgt.lR=-2; } }
  if (H.prop && !pose.usesR){ tgt.aR=-14; tgt.eR=150; }
  const k = 1-Math.exp(-dt*16);
  for (const key in tgt){ cur[key]+= (tgt[key]-cur[key])*k; }
  if (pose.once && Math.abs(Math.abs(tgt.rot)-360)<.01 && Math.abs(cur.rot-tgt.rot)<2){ cur.rot=0; pose.frames[pose.frames.length-1].rot=0; }
  apply();
  if (curFace==='normal' && now>blinkT){ J.eyes.setAttribute('transform','translate(0 -17) scale(1 .12) translate(0 17)'); setTimeout(()=>J.eyes.removeAttribute('transform'),120); blinkT=now+rnd(2500,5000); }
  updateNPCs(dt, now);
  try{ drawVehicle(); }catch(e){}

  positionBubble();

}
/* camera: on tall/narrow screens show a slice of the room and follow the tenant */

  const r=cam.getBoundingClientRect(); if(!r.width||!r.height) return;

  const target=clamp(H.X - (H.lying?28:0), w/2, 480-w/2);
  camX += (target-camX)*(dt>0?Math.min(1,dt*4):1);
  const x=clamp(camX-w/2,0,480-w);
  const key=`${x.toFixed(1)} ${y.toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}`;

}

  J.tor.setAttribute('transform',`rotate(${cur.tor})`);

  J.armR.setAttribute('transform',`translate(17 -38) rotate(${cur.aR})`); J.elR.setAttribute('transform',`translate(0 19) rotate(${cur.eR})`);

  if (!bubble.classList.contains('show')) return;

  const hr=J.head.getBoundingClientRect(), cr=cam.getBoundingClientRect();

  const svg=sanitizeSVG(s.svg); if(!svg) return;
  const x=clamp(+s.x||240,-100,580), y=clamp(+s.y||STAND,-50,320), sc=clamp(+s.scale||1,.2,4);

  const g=document.createElementNS(NS,'g'); g.setAttribute('transform',`translate(${x} ${y}) scale(${sc})`);
  const inner=document.createElementNS(NS,'g'); inner.innerHTML=svg;
  if (['bob','spin','wobble','pulse'].includes(s.anim)) inner.setAttribute('class','an-'+s.anim);
  g.appendChild(inner); parent.appendChild(g);

  await new Promise(res=>{ (function st(now){ if(!alive(rid)) return res(); const f=Math.min(1,(now-t0)/ms), e=ease(f); o.x=fx+(tx-fx)*e; o.y=fy+(ty-fy)*e; o.g.setAttribute('transform',`translate(${o.x} ${o.y}) scale(${o.sc})`); if(carry){ H.X=hx+(o.x-fx); H.Y=hy+(o.y-fy); } if(f<1) requestAnimationFrame(st); else res(); })(performance.now()); });

function parseSteps(text){
  if (!text) return null;
  const a=text.indexOf('{'), b=text.lastIndexOf('}'); if(a<0||b<a) return null;
  try { const j=JSON.parse(text.slice(a,b+1)); if (Array.isArray(j.steps) && j.steps.length) return j.steps.slice(0,26); } catch(e){}
  return null;
}

/* ================= PHONE (relay through ntfy.sh: free, no accounts, works on any network) =================
   Your number = name + 3-digit code. Friends call you with "call <name> <code>". */
const NTFY='https://ntfy.sh';
let es=null, call=null, peerReady=false;
const keyOf = n => String(n||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'').slice(0,18);
const topicOf = (name, code) => `subservient-game-v2-${keyOf(name)}-${code}`;
function presenceUpdate(){}
function showNumberSafe(){ if (typeof showNumber==='function') showNumber(); }
function showNumber(){ $('mynum').innerHTML = `${UI_IC('phone',16)} ${tr('yournum')}: <b>${esc(H.name)} ${esc(H.code)}</b> · <span class="muted">${esc(tr('howcall',H.name+' '+H.code))}</span>${aiOK===false?`<br><span class="muted">${UI_IC('brain',16)} ${esc(tr('aioff'))}</span>`:aiOK?`<br><span class="muted">${UI_IC('brain',16)} ${esc(tr('aion'))}</span>`:''}`; }
function initPeer(){
  try { if (es) es.close(); } catch(e){}
  peerReady=false;
  if (typeof EventSource==='undefined') return;
  const startedAt=Math.floor(Date.now()/1000)-5;
  es = new EventSource(`${NTFY}/${topicOf(H.name,H.code)}/sse`);
  es.onopen = ()=>{ peerReady=true; };
  es.onerror = ()=>{ peerReady=false; };   // EventSource reconnects by itself
  es.onmessage = ev=>{
    let m; try { m=JSON.parse(ev.data); } catch(e){ return; }
    if (m.event!=='message' || (m.time||0)<startedAt) return;
    let d; try { d=JSON.parse(m.message); } catch(e){ return; }
    onPhoneData(d);
  };
}
async function sendTo(topic, msg){
  try { await fetch(`${NTFY}/${topic}`, {method:'POST', body: JSON.stringify({...msg, from:H.name, fromTopic:topicOf(H.name,H.code)})}); return true; }
  catch(e){ return false; }
}
function send(msg){ if (call && call.topic) sendTo(call.topic, msg); }
function openChatWith(topic, name){
  if (!call || call.topic!==topic){ call={topic, peerName:String(name||'?').slice(0,18), state:'active'}; openCallBox(); }
  else if (!$('callbox').classList.contains('show')) openCallBox();
}
function onPhoneData(d){
  if (!d || typeof d!=='object' || !d.fromTopic) return;
  if (onVisitData(d)) return;
  if (d.t==='ring'){ openChatWith(d.fromTopic, d.from); log('sys', tr('chatopened', call.peerName+' '+String(d.code||''))); ringAnim(); return; }
  if (d.t==='chat'){ const isNew = !call || call.topic!==d.fromTopic; openChatWith(d.fromTopic, d.from); if (isNew) ringAnim(); const t=String(d.text||'').slice(0,200); log('them',t); say(`${call.peerName}: ${t}`, null, true); return; }
  if (d.t==='hang' && call && call.topic===d.fromTopic){ log('sys', tr('chatclosed', call.peerName)); }
}
function ringAnim(){ const id=++runId; stopFx(); (async()=>{ await standUp(id); setProp('phone'); setPose('scared'); say(tr('ring'),2500,true); await sleep(1200); if(alive(id)&&call&&call.state==='incoming') setPose('phone'); })(); }
function openCallBox(){ $('callTitle').innerHTML=UI_IC('phone',18)+' '+esc(call.peerName); $('callbox').classList.add('show'); $('log').innerHTML=''; }
function log(who, t){ const d=document.createElement('div'); d.className=who; d.textContent=t; $('log').appendChild(d); $('log').scrollTop=1e6; }
function endCall(msg){
  if(!call) return; $('incoming').classList.remove('show');
  if (msg){ log('sys',msg); say(msg,2500,true); }
  call=null;
  setTimeout(()=>{ if(!call) $('callbox').classList.remove('show'); },1800); setProp('mug'); setPose('idle');
}
async function startCall(name, code){
  const key=keyOf(name), id=++runId; code=String(code||'').replace(/\D/g,'').slice(0,3);
  if (!key) return;
  if (code.length!==3){ say(tr('needcode'),3500); return; }
  if (key===keyOf(H.name) && code===H.code){ say(tr('self'),2500); return; }
  await standUp(id); setProp('phone'); setPose('phone'); caption.textContent='> '+tr('callingOut')+' '+name+' '+code;
  call={topic:topicOf(name,code), peerName:String(name).slice(0,18), state:'active'}; openCallBox();
  log('sys', tr('chatwith', call.peerName+' '+code));
  const ok = await sendTo(call.topic, {t:'ring', code:H.code});
  if (!ok) log('sys', tr('nosignal'));
  setTimeout(()=>{ try{ $('chatIn').focus({preventScroll:true}); }catch(e){} }, 60);
}
$('btnAnswer').onclick=()=>openDoor(); $('btnDecline').onclick=()=>ignoreDoor();
$('btnHang').onclick=()=>{ if(!call) return; send({t:'hang'}); call=null; $('callbox').classList.remove('show'); setProp('mug'); setPose('idle'); if (window.focusCmd) focusCmd(); };

const HOUSE_ROOMS=['living','kitchen','bathroom','bedroom','garden'];

let DECO={}; try { DECO=JSON.parse(localStorage.getItem('subservientDeco')||'{}')||{}; } catch(e){}
function saveDeco(){ try{ localStorage.setItem('subservientDeco', JSON.stringify(DECO)); }catch(e){} }
function decoSrc(){ return H.visit ? (H.visitDeco||{}) : DECO; }
function decorate(r, b){
  if (!HOUSE_ROOMS.includes(r)) return b;
  const d=decoSrc()[r]; if (!d) return b;
  if (r==='garden'){
    if (d.wall) b=b.replace('<g fill="#f7f2e6">', `<g fill="${d.wall}">`);
    if (d.floor) b=b.replace('fill="url(#gGrass)"', `fill="${d.floor}"`);
  } else {
    if (d.wall) b=b.replace(/(<rect width="480" height="232" fill=")#[0-9a-f]{6}/, '$1'+d.wall);
    if (d.floor) b=b.replace(/(<rect y="232" width="480" height="68" fill=")[^"]+/, '$1'+d.floor);
  }
  const items=(d.items||[]).filter(it=>DECOR[it.k]);
  const out=r==='garden';
  const yOf=it=>{ const D=DECOR[it.k]; if (D.wall) return out?150:96; if (D.rug) return out?262:264; return out?248:244; };
  const sorted=[...items].sort((a,b2)=>(DECOR[a.k].rug?0:1)-(DECOR[b2.k].rug?0:1));
  b+=sorted.map(it=>`<g transform="translate(${clamp(+it.x||240,20,460)} ${yOf(it)})">${DECOR[it.k].svg}</g>`).join('');
  return b;
}
const COLOR_IT={rosso:'#d64545',rossa:'#d64545',blu:'#3f6fd1',azzurro:'#9ccfe8',azzurra:'#9ccfe8',celeste:'#9ccfe8',verde:'#7cbf7a',giallo:'#f2d95c',gialla:'#f2d95c',rosa:'#f2a7c3',viola:'#b79ce0',lilla:'#cdb8ea',arancione:'#f4a261',nero:'#2b2d31',nera:'#2b2d31',bianco:'#f4f1ea',bianca:'#f4f1ea',grigio:'#a9adb5',grigia:'#a9adb5',marrone:'#8b5a2b',oro:'#d4af37',dorato:'#d4af37',beige:'#e6d8ba',crema:'#f3ead3',turchese:'#2fb5a8',legno:'#a0703f',wood:'#a0703f'};
Object.assign(COLOR_NAMES, COLOR_IT);
function findColor(t){ const m=String(t).toLowerCase().match(/#[0-9a-f]{6}\b/); if (m) return m[0]; for (const w of String(t).toLowerCase().split(/[^a-zà-ú#0-9]+/)) if (COLOR_NAMES[w]) return COLOR_NAMES[w]; return null; }
function findDecor(t){ t=String(t).toLowerCase(); let best=null, len=0; for (const k in DECOR){ for (const w of [...DECOR[k].it,...DECOR[k].en]) if (t.includes(w) && w.length>len){ best=k; len=w.length; } } return best; }
function roomFromText(t){ const m=String(t).toLowerCase().match(/(cucina|bagno|camera|giardino|soggiorno|salotto|kitchen|bathroom|bedroom|garden|living)/); return m ? {cucina:'kitchen',kitchen:'kitchen',bagno:'bathroom',bathroom:'bathroom',camera:'bedroom',bedroom:'bedroom',giardino:'garden',garden:'garden',soggiorno:'living',salotto:'living',living:'living'}[m[1]] : null; }
const FREE_SPOTS={living:[252,455,190,30,385],kitchen:[470,30,300,200],bathroom:[250,470,30,110],bedroom:[290,40,250,470],garden:[60,330,440,200,260]};
function freeX(r){ const used=((DECO[r]||{}).items||[]).map(i=>+i.x); for (const x of (FREE_SPOTS[r]||[])) if (!used.some(u=>Math.abs(u-x)<40)) return x; const c=[70,150,210,290,350,420,120,250,380,40]; let best=240, bd=-1; for (const x of c){ const d=Math.min(999,...used.map(u=>Math.abs(u-x))); if (d>bd){ bd=d; best=x; } } return best; }
/* apply a decor change to MY house; returns a short line to say, or null */
function decoApply(o){
  let r=o.room&&HOUSE_ROOMS.includes(o.room)?o.room:(HOUSE_ROOMS.includes(H.room)?H.room:'living');
  const it=LANG==='it';
  if (o.add && DECOR[o.add] && !owns(o.add)) return (LANG==='it'?`Non ce l'ho. Costa ${DECOR[o.add].p} Pippi: scrivi “compra ${DECOR[o.add].it[0]}”.`:`Don't own it. ${DECOR[o.add].p} Pippi: type “buy ${DECOR[o.add].en[0]}”.`);
  if (o.add && DECOR[o.add]){
    const D=DECOR[o.add];
    if (D.only==='out' && r!=='garden') r='garden';
    const d=DECO[r]||(DECO[r]={}); d.items=d.items||[];
    if (d.items.length>=12) return it?'La stanza è piena.':'The room is full.';
    d.items.push({k:o.add, x:typeof o.x==='number'?clamp(o.x,20,460):freeX(r)});
  }
  if (o.remove){ const d=DECO[r]; if (d&&d.items){ const i=d.items.map(x=>x.k).lastIndexOf(o.remove); if (i>=0) d.items.splice(i,1); else return null; } else return null; }
  if (o.clear){ DECO[r]={}; }
  const d=DECO[r]||(DECO[r]={});
  const w=normColor(o.wall), f=normColor(o.floor); if (w) d.wall=w; if (f) d.floor=f;
  saveDeco(); if (!H.visit && H.room===r) drawRoom(r);
  try { if (H.guest) sendTo(H.guest.topic,{t:'deco', deco:DECO}); } catch(e){}
  return r;
}
/* "dipingi le pareti di rosa", "metti un acquario", "togli il gatto", "pavimento blu" */
function decoCommand(cmd){
  const t=cmd.toLowerCase();
  if (H.visit) return null;
  const room=roomFromText(t);
  const isWall=/(paret|muri|muro|\bwalls?\b|staccionat|recinto|\bfence\b)/.test(t), isFloor=/(paviment|\bfloor|prato|erba\b|\bgrass|\blawn)/.test(t);
  const col=findColor(t);
  if ((isWall||isFloor) && col){
    return {room:room||(/(staccionat|recinto|fence|prato|erba|grass|lawn)/.test(t)?'garden':null), wall:isWall?col:null, floor:isFloor?col:null};
  }
  const k=findDecor(t); if (!k) return null;
  if (/(togli|rimuovi|leva|elimina|butta via|via il|via la|remove|delete|get rid)/.test(t)) return {room, remove:k};
  if (/(metti|aggiungi|compra|piazza|mettere|voglio|add|put|buy|place|get)/.test(t)) return {room, add:k};
  return null;
}
async function runDeco(o){
  const id=++runId;
  const target=o.room||(DECOR[o.add]&&DECOR[o.add].only==='out'?'garden':(HOUSE_ROOMS.includes(H.room)?H.room:'living'));
  if (target!==H.room) await gotoRoom(target, 240, id);
  if (!alive(id)) return;
  setPose(o.wall||o.floor?'sweep':'present');
  await sleep(900);
  const r=decoApply({...o, room:target});
  if (r===null){ setPose('shrug'); say(LANG==='it'?'Non c\'è niente del genere qui.':'There\'s nothing like that here.',2500); await sleep(1500); setPose('idle'); return; }
  if (typeof r==='string'&&!HOUSE_ROOMS.includes(r)){ setPose('shrug'); say(r,3500); await sleep(1500); setPose('idle'); return; }
  setPose('cheer'); say(typeof r==='string'&&!HOUSE_ROOMS.includes(r)?r:(LANG==='it'?['Fatto. Arredatore nato.','Ecco. Stile.','Ora sì che è casa mia.'][Math.floor(Math.random()*3)]:['Done. Natural designer.','There. Style.','Now it feels like home.'][Math.floor(Math.random()*3)]),2600);
  await sleep(1800); if (alive(id)) setPose('idle');
}

function onPlaceMsg(d, r){
  if (!d || d.sid===PL.sid || H.room!==r) return;

  if (d.t==='bye'){ const p=PL.peers[id]; if (p){ npcWalk(p.n, p.n.X<240?-60:540).then(()=>removeNPC(p.n)); delete PL.peers[id]; } return; }
  let p=PL.peers[id];
  if (d.t==='here'){
    if (!p) postPlace({t:'here', ...myPublic()});
    if (!p){ const n=makeNPC({name:cleanTxt(d.name).slice(0,18)||'?', kind:d.kind==='f'?'f':'m', room:r, x:Math.random()<.5?-50:530}); n.player=true; p=PL.peers[id]={n, last:Date.now()};
      npcWalk(n, clamp(+d.x||240,30,450)).then(()=>{ p.arrived=true; npcPose(n,'wave'); npcSay(n, LANG==='it'?'Ciao!':'Hi!'); setTimeout(()=>npcPose(n,'idle'),1800); }); }

    if (d.look && JSON.stringify(d.look)!==JSON.stringify(p.n.look)){ p.n.look=d.look; npcLook(p.n, d.look); }
    const ck=d.costume||'pajamas'; if (ck!==p.n.costumeKey){ p.n.costumeKey=ck; if (COST[ck]) npcCostume(p.n, ck); }

    return;
  }
  if (!p) return; p.last=Date.now();
  if (d.t==='script'){ const steps=(d.steps||[]).slice(0,20).map(s=>({...s, say:s.say?cleanTxt(s.say):undefined, text:s.text?cleanTxt(s.text):undefined})).filter(s=>!['goto'].includes(s.do)||!s.room||s.room===r); npcRun(p.n, steps); }

/* bots answer when you mention them */
function botReact(cmd){
  const t=String(cmd).toLowerCase();
  for (const n of PL.bots){ if (n.room===H.room && t.includes(n.name.toLowerCase())){
    n.busy=true; setTimeout(async()=>{ await npcWalk(n, clamp(H.X+(H.X<240?60:-60),30,450)); n.dir=H.X>n.X?1:-1;
      const hug=/(abbraccia|hug)/.test(t), dance=/(balla|dance)/.test(t), kiss=/(bacia|bacio|kiss)/.test(t);
      npcPose(n, hug?'hug':dance?'dance':kiss?'kiss':'wave', 'happy'); npcSay(n, pickLine('reply')); await sleep(2600); npcPose(n,'idle'); n.busy=false; }, 1200);

/* who is the command about? (players first, then bots, then visitors) */
function peopleHere(){ return NPCS.filter(n=>n.room===H.room && n.name && n.alpha>0.2); }
function targetIn(cmd){
  const t=' '+String(cmd).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')+' ';
  const ppl=peopleHere().sort((a,b)=>(b.player?2:b.topic?1:0)-(a.player?2:a.topic?1:0));
  for (const n of ppl){ const nm=n.name.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); if (nm.length>=2 && new RegExp('[^a-z]'+nm.replace(/[^a-z0-9]/g,'')+'[^a-z]').test(t)) return n; }
  return null;
}
function describePerson(n){ const l=n.look||{}; return `${n.name} (${n.player?'real player':n.passer?'rude passer-by bot':n.bot?'bot, '+(n.role?n.role.en:'local'):n.topic?'friend visiting':'person'}, ${n.kind==='f'?'woman':'man'}, x=${Math.round(n.X)}${l.hair?`, ${l.hair} hair`:''})`; }
async function approachStep(s, id){
  // characters keep their distance; "close":true only when the command explicitly asks to stand in front of / on someone
  const want=String(s.name||s.to||'').toLowerCase(); if (!want) return;
  const n=peopleHere().find(x=>x.name.toLowerCase()===want) || peopleHere().find(x=>x.name.toLowerCase().startsWith(want));
  if (!n) return;
  await standUp(id);
  const side = H.X<=n.X ? -1 : 1;
  const dist=s.close?16:GAP; let tx=n.X+side*dist; if (tx<20||tx>460) tx=n.X-side*dist;
  window.__closeOK=true; try { await walkTo(clamp(tx,20,460), id); } finally { window.__closeOK=false; } if (!alive(id)) return;
  H.dir = n.X>H.X?1:-1; n.dir = H.X>n.X?1:-1;
}
/* AI step: {"do":"npc","name":"Gino","pose":"dance","say":"..."} moves a bot (or the partner) */
async function npcStep(s, id){
  const n=NPCS.find(x=>x.room===H.room && x.name && s.name && x.name.toLowerCase()===String(s.name).toLowerCase() && !x.player);
  if (!n) return; n.busy=true;
  await npcWalk(n, typeof s.x==='number'?clamp(s.x,20,460):clamp(H.X+(H.X<240?55:-55),20,460), id); n.dir=H.X>n.X?1:-1;
  if (s.pose) npcPose(n, POSES[s.pose]?s.pose:'idle', s.face); if (s.say) npcSay(n, cleanTxt(s.say));
  await sleep(clamp(+s.ms||1800,300,6000)); n.busy=false;
}

const SLOT=['🍒','🍋','🔔','⭐','7️⃣'];
function playGame(game, bet, choice){
  const it=LANG==='it'; bet=Math.max(1,Math.min(+bet||10, 500));
  if (H.room!=='bisca') return {msg:it?'Qui non si gioca.':'No gambling here.'};
  if (LIFE.pippi<bet) return {msg:it?`Non hai ${bet} Pippi.`:`You don't have ${bet} Pippi.`};
  addPippi(-bet); let win=0, show='';
  if (game==='slot'){ const r=[0,1,2].map(()=>SLOT[Math.floor(Math.random()*5)]); show=r.join(' ');
    if (r[0]===r[1]&&r[1]===r[2]) win = r[0]==='7️⃣'? bet*20 : bet*8; else if (r[0]===r[1]||r[1]===r[2]||r[0]===r[2]) win=bet; }
  else if (game==='roulette'){ const n=Math.floor(Math.random()*37); const reds=[1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]; const col=n===0?'verde':reds.includes(n)?'rosso':'nero';
    show=`${n} ${col==='rosso'?'🔴':col==='nero'?'⚫':'🟢'}`; const c=String(choice||'rosso').toLowerCase();
    if (/^\d+$/.test(c)) { if (+c===n) win=bet*36; } else { const want=/ner|black/.test(c)?'nero':'rosso'; if (col===want) win=bet*2; } }
  else { const me=[1,2].map(()=>1+Math.floor(Math.random()*6)), hs=[1,2].map(()=>1+Math.floor(Math.random()*6)); const a=me[0]+me[1], b=hs[0]+hs[1];
    show=`${it?'Tu':'You'} 🎲${me.join('+')}=${a} · ${it?'Banco':'House'} 🎲${hs.join('+')}=${b}`; if (a>b) win=bet*2; else if (a===b) win=bet; }
  if (win) addPippi(win); try{ mood(win>bet?8:win<bet?-6:0); }catch(e){} if (win>=bet*20){ award('jackpot'); gossip(`${H.name} ha sbancato alla bisca! ${win} Pippi!`, `${H.name} hit the jackpot at the den! ${win} Pippi!`); } else if (win-bet<=-50) gossip(`${H.name} ha perso ${bet} Pippi in una botta sola. Poveraccio.`, `${H.name} lost ${bet} Pippi in one go. Poor thing.`);
  const id=++runId; const net=win-bet;
  if (net>0){ setPose('cheer','happy'); startFx('confetti'); setTimeout(stopFx,1800); } else if (net<0){ setPose('cry','sad'); } else setPose('shrug');
  setTimeout(()=>{ if (alive(id)) setPose('idle'); }, 2200);
  const cr=PL.bots.find(b=>b.name==='Ercole'); if (cr) npcSay(cr, net>0?(it?'Complimenti. Il banco paga.':'Congrats. The house pays.'):net<0?(it?'Il banco ringrazia.':'The house thanks you.'):(it?'Pari.':'Push.'));
  return {msg:`${show} → ${net>0?'+'+net:net} 🪙`, net};
}

/* ================= MARKET & GIFTS between friends ================= */
function friendSend(name, code, msg){ fetch(`${NTFY}/${topicOf(name,code)}-db`,{method:'POST',body:JSON.stringify({...msg, id:msg.id||Date.now().toString(36)+Math.random().toString(36).slice(2,6), from:H.name, fromTopic:topicOf(H.name,H.code)})}).catch(()=>{}); }
function findItemKey(t){ t=String(t).toLowerCase(); const all={...PREMIUM}; return Object.keys(all).find(k=>[...all[k].it,...all[k].en].some(w=>t.includes(w))); }
function dropItem(k){ LIFE.owned=(LIFE.owned||[]).filter(x=>x!==k); for (const r of HOUSE_ROOMS){ const d=DECO[r]; if (d&&d.items) d.items=d.items.filter(x=>x.k!==k); } saveDeco(); saveLife(); if (HOUSE_ROOMS.includes(H.room)&&!H.visit) drawRoom(H.room); }
function giftCmd(cmd){ const it=LANG==='it';
  const m=cmd.match(/(?:regala|regalo|dona|manda|gift|give|send)\s+(.+?)\s+(?:a|ad|to)\s+([A-Za-zÀ-ÿ']{1,18})\s+(\d{3})\b/i); if (!m) return false;
  const what=m[1], name=m[2], code=m[3]; const n=what.match(/(\d+)\s*(pippi)?/i);
  if (n && /pippi|^\d+$/i.test(what.trim())){ const a=+n[1]; if (a<=0) return true; if (LIFE.pippi<a){ say(it?`Non ho ${a} Pippi.`:`I don't have ${a} Pippi.`,2500); return true; }
    addPippi(-a); friendSend(name,code,{t:'gift', amount:a}); say(it?`Mandati ${a} Pippi a ${name}. Che cuore.`:`Sent ${a} Pippi to ${name}. What a heart.`,3000); setPose('present'); gossip(`${H.name} ha regalato ${a} Pippi a ${name}. Sospetto...`, `${H.name} gave ${a} Pippi to ${name}. Suspicious...`); return true; }
  const k=findItemKey(what); if (!k || !LIFE.owned.includes(k)){ say(it?'Non ce l\'ho, quello.':'I don\'t own that.',2500); return true; }
  dropItem(k); friendSend(name,code,{t:'gift', item:k}); say(it?`Regalato ${PREMIUM[k].it[0]} a ${name}. 🎁`:`Gave ${PREMIUM[k].en[0]} to ${name}. 🎁`,3000); setPose('present'); return true; }
function sellCmd(cmd){ const it=LANG==='it';
  let m=cmd.match(/(?:vendi|vendo|sell)\s+(.+?)\s+(?:a|ad|to)\s+([A-Za-zÀ-ÿ']{1,18})\s+(\d{3})\s+(?:per|a|for)\s+(\d+)/i);
  if (m){ const k=findItemKey(m[1]); if (!k||!LIFE.owned.includes(k)){ say(it?'Non posso vendere quello che non ho.':'Can\'t sell what I don\'t own.',2500); return true; }
    const price=Math.max(1,+m[4]); friendSend(m[2],m[3],{t:'offer', item:k, price}); say(it?`Offerta mandata a ${m[2]}: ${PREMIUM[k].it[0]} per ${price} Pippi.`:`Offer sent to ${m[2]}: ${PREMIUM[k].en[0]} for ${price} Pippi.`,3000); return true; }
  m=cmd.match(/^\s*(?:vendi|vendo|sell)\s+(.+)$/i); if (!m) return false;
  const k=findItemKey(m[1]); if (!k||!LIFE.owned.includes(k)){ say(it?'Non ce l\'ho.':'Don\'t own it.',2000); return true; }
  const val=Math.floor(PREMIUM[k].p/2); dropItem(k); addPippi(val); say(it?`Il rigattiere me l'ha preso per ${val} Pippi. Ladro.`:`The junk dealer gave me ${val} Pippi. Thief.`,3000); return true; }
function friendMsg(d){ const it=LANG==='it'; LIFE.seenMsgs=LIFE.seenMsgs||[]; if (LIFE.seenMsgs.includes(d.t+d.id)) return; LIFE.seenMsgs.push(d.t+d.id); if (LIFE.seenMsgs.length>120) LIFE.seenMsgs.splice(0,40); saveLife();
  if (d.t==='gift'){ if (d.amount){ addPippi(+d.amount||0); say(it?`🎁 ${d.from} mi ha regalato ${d.amount} Pippi!`:`🎁 ${d.from} gave me ${d.amount} Pippi!`,4000); } else if (PREMIUM[d.item]){ if (!LIFE.owned.includes(d.item)) LIFE.owned.push(d.item); saveLife(); say(it?`🎁 ${d.from} mi ha regalato: ${PREMIUM[d.item].it[0]}! È nel negozio, “Metti”.`:`🎁 ${d.from} gave me: ${PREMIUM[d.item].en[0]}! Find it in the shop, “Place”.`,4500); } mood(10); return; }
  if (d.t==='offer' && PREMIUM[d.item]){ const P=PREMIUM[d.item];
    sheet(`<h3>🛒 ${it?'Mercatino':'Market'}</h3><p>${esc(d.from)} ${it?'ti vende':'offers you'} <b>${(it?P.it:P.en)[0]}</b> ${it?'per':'for'} <b>${+d.price} Pippi</b>. (${it?'Hai':'You have'} ${LIFE.pippi})</p><div class="col"><button type="button" id="ofYes">${it?'Compra':'Buy'}</button><button class="ghost" type="button" id="ofNo">${it?'No grazie':'No thanks'}</button></div>`);
    $('ofNo').onclick=()=>{ closeSheet(); fetch(`${NTFY}/${d.fromTopic}-db`,{method:'POST',body:JSON.stringify({t:'nodeal', id:d.id, from:H.name})}).catch(()=>{}); };
    $('ofYes').onclick=()=>{ closeSheet(); if (LIFE.pippi<+d.price){ say(it?'Non ho abbastanza Pippi.':'Not enough Pippi.',2500); return; } addPippi(-(+d.price)); if (!LIFE.owned.includes(d.item)) LIFE.owned.push(d.item); saveLife();
      fetch(`${NTFY}/${d.fromTopic}-db`,{method:'POST',body:JSON.stringify({t:'paid', id:d.id, item:d.item, price:+d.price, from:H.name, fromTopic:topicOf(H.name,H.code)})}).catch(()=>{}); say(it?`Comprato! Ora è mio.`:`Bought! It's mine.`,2500); };
    return; }
  if (d.t==='paid'){ if ((LIFE.owned||[]).includes(d.item)){ dropItem(d.item); addPippi(+d.price||0); say(it?`💰 ${d.from} ha comprato il mio ${PREMIUM[d.item]?PREMIUM[d.item].it[0]:'oggetto'}: +${d.price} Pippi.`:`💰 ${d.from} bought my ${PREMIUM[d.item]?PREMIUM[d.item].en[0]:'item'}: +${d.price} Pippi.`,4000); }
    else fetch(`${NTFY}/${d.fromTopic}-db`,{method:'POST',body:JSON.stringify({t:'refund', id:d.id, price:d.price, item:d.item, from:H.name})}).catch(()=>{}); return; }
  if (d.t==='refund'){ addPippi(+d.price||0); LIFE.owned=(LIFE.owned||[]).filter(x=>x!==d.item); saveLife(); say(it?`${d.from} non aveva più l'oggetto: Pippi restituiti.`:`${d.from} no longer had it: refunded.`,3500); return; }
  if (d.t==='nodeal'){ say(it?`${d.from} ha rifiutato l'offerta. Tirchio.`:`${d.from} turned down the offer. Cheapskate.`,3000); return; }
}

/* ================= PIAZZA NOTICE BOARD (posts last 12 hours) ================= */
const BOARD_TOPIC='subservient-game-v2-board'; const BOARD=[]; let boardES=null;
function startBoard(){ try{ if (boardES) boardES.close(); boardES=new EventSource(`${NTFY}/${BOARD_TOPIC}/sse?since=12h`); boardES.onmessage=ev=>{ let m; try{ m=JSON.parse(ev.data); }catch(e){ return; } if (m.event!=='message') return; let d; try{ d=JSON.parse(m.message); }catch(e){ return; }
  if (d.t!=='post' || !d.text) return; BOARD.push({name:String(d.name||'?').slice(0,18), text:String(d.text).slice(0,160), at:m.time*1000}); while (BOARD.length>40) BOARD.shift(); if ($('sheet').classList.contains('show') && $('boardList')) openBoard(); }; } catch(e){} }
function postBoard(text){ text=String(text||'').trim().slice(0,160); if (!text) return; fetch(`${NTFY}/${BOARD_TOPIC}`,{method:'POST',body:JSON.stringify({t:'post', name:H.name, text})}).catch(()=>{}); say(LANG==='it'?'Appeso in bacheca.':'Pinned on the board.',2000); }
function openBoard(){ const it=LANG==='it';
  sheet(`<h3>📌 ${it?'Bacheca della piazza':'Square notice board'}</h3><div id="boardList">${BOARD.length?BOARD.slice().reverse().map(p=>`<div class="req"><div><b>${esc(p.name)}</b> <small>${new Date(p.at).toTimeString().slice(0,5)}</small><br>${esc(p.text)}</div></div>`).join(''):`<p class="muted">${it?'Bacheca vuota.':'Board is empty.'}</p>`}</div>
   <div class="row" style="margin-top:10px"><input id="boardIn" maxlength="160" placeholder="${it?'Scrivi un messaggio per tutti...':'Write something for everyone...'}"><button type="button" id="boardGo">📌</button></div><p class="muted small">${it?'I messaggi restano 12 ore.':'Posts last 12 hours.'}</p><button class="ghost close" id="shClose">${tr('c_close')}</button>`);
  $('shClose').onclick=closeSheet; $('boardGo').onclick=()=>{ postBoard($('boardIn').value); $('boardIn').value=''; }; }

async function startParty(invites){ const it=LANG==='it'; if (H.visit){ say(it?'La festa si fa a casa mia.':'Parties happen at my place.',2500); return; }
  if (PARTY){ say(it?'La festa è già in corso!':'The party is already on!',2000); return; }
  const id=++runId; await gotoRoom('living',240,id);
  PARTY={until:Date.now()+8*60000, npcs:[], dj:null}; mood(15);
  const names=['Ciccio','Tamara','Il Rosso','Jenny','Bruno','Lola']; 
  for (let i=0;i<3;i++){ const k=i%2?'f':'m'; const n=makeNPC({name:names[(Date.now()/1000+i)%names.length|0], kind:k, room:'living', x:i%2?530:-50}); npcLook(n, randomLook(k)); n.bot=true; n.role={it:'invitato',en:'guest'}; PARTY.npcs.push(n); npcWalk(n, [110,330,420][i]); }
  (invites||[]).forEach(([nm,cd])=>{ sendTo(topicOf(nm,cd), {t:'chat', text: it?`🎉 FESTA a casa mia adesso! Scrivi: vai a casa di ${H.name} ${H.code}`:`🎉 PARTY at my place now! Type: go to ${H.name}'s house ${H.code}`}); });
  say(it?`🎉 Festa! ${(invites||[]).length?'Invitati: '+invites.map(x=>x[0]).join(', ')+'. ':''}Scrivi “chiama il DJ” (20 Pippi).`:`🎉 Party! ${(invites||[]).length?'Invited: '+invites.map(x=>x[0]).join(', ')+'. ':''}Type “call the DJ” (20 Pippi).`,4500);
  gossip(`Stasera festa a casa di ${H.name}!`, `Party tonight at ${H.name}'s!`);
  PARTY.t=setInterval(()=>{ if (!PARTY) return; if (Date.now()>PARTY.until){ endParty(); return; }
    if (H.room==='living'){ txt(rnd(40,440), rnd(60,150), Math.random()<.5?'♪':'♫', ['#ff5c86','#ffd166','#4cc9f0'][rnd(0,2.99)|0], rnd(14,22)); PARTY.npcs.forEach(n=>{ if (!n.busy) npcPose(n, ['dance','disco','twist','robot','cheer'][Math.floor(Math.random()*5)]); }); } }, 1500);
  PARTY.cop=setTimeout(async()=>{ if (!PARTY || Math.random()>.4) return; const n=makeNPC({name:it?'Vigile Gennaro':'Officer Gennaro', kind:'m', room:'living', x:530}); npcLook(n,{hair:'short',hairColor:'#6b3e26',skin:'#eab48a',glasses:true,outfit:'#1d3557',pants:'#1d3557'}); n.bot=true;
    await npcWalk(n, 400); npcSay(n, it?'I vicini si lamentano. Schiamazzi: 20 Pippi.':'The neighbours complained. Noise: 20 Pippi.',3500); addPippi(-Math.min(20,LIFE.pippi)); LIFE.record=(LIFE.record||0)+1; saveLife(); award('fined'); await sleep(3500); await npcWalk(n,540); removeNPC(n); }, rnd(150000,300000)); }
function endParty(){ if (!PARTY) return; clearInterval(PARTY.t); clearTimeout(PARTY.cop); PARTY.npcs.forEach(n=>npcWalk(n, n.X<240?-60:540).then(()=>removeNPC(n))); if (PARTY.dj) npcWalk(PARTY.dj,540).then(()=>removeNPC(PARTY.dj)); PARTY=null; say(LANG==='it'?'Festa finita. Che casino in casa.':'Party\'s over. What a mess.',3000); LIFE.clean=Math.max(0,LIFE.clean-10); saveLife(); }
async function hireDJ(){ const it=LANG==='it'; if (!PARTY){ say(it?'Prima organizza una festa.':'Throw a party first.',2000); return; } if (PARTY.dj){ say(it?'Il DJ c\'è già.':'DJ\'s already here.',2000); return; }
  if (LIFE.pippi<20){ say(it?'Il DJ costa 20 Pippi.':'The DJ costs 20 Pippi.',2000); return; } addPippi(-20);
  const d=makeNPC({name:'DJ Max', kind:'m', room:'living', x:530}); npcLook(d,BOTS.disco[0].look); d.bot=true; d.role={it:'DJ',en:'DJ'}; PARTY.dj=d; PARTY.npcs.push(d); await npcWalk(d, 260); npcPose(d,'conduct'); npcSay(d, it?'Mani in alto, salotto!':'Hands up, living room!'); PARTY.until+=3*60000; mood(8); }

H.visit=null;      // when I'm a guest: {topic, name, kind}
H.guest=null;      // when I host: {topic, name, kind, npc}
let hostNPC=null;
function npcCostume(n, c){
  if (typeof c==='string') c={preset:c};
  const m={...(COST[c.preset]||{}), ...c};
  const skin=normColor(m.skin)||SKIN;
  const outfit=m.outfit==='@skin'?skin:(normColor(m.outfit)||(n.kind==='f'?'#3f9a8c':'#d9a93b'));
  const pants=m.pants==='@skin'?skin:(normColor(m.pants)||'#8fa9c9');
  dressNPC(n, outfit, pants); n.g.style.setProperty('--skin',skin); n.g.style.setProperty('--skinD',shade(skin,.93));
  n.P.cHat.innerHTML=sanitizeSVG(m.hat||''); n.P.cFace.innerHTML=sanitizeSVG(m.face||'');
  n.P.cTorso.innerHTML=sanitizeSVG((n.kind==='f'?(m.torsoF||m.torso):(m.torsoM||m.torso))||''); n.P.cBack.innerHTML=sanitizeSVG(m.back||'');
  if (n.look){ const L=n.look, base=!c.preset||c.preset==='pajamas';
    n.P.hairBack.innerHTML=hairSVG(L,'back'); n.P.hairFront.innerHTML=hairSVG(L,'front'); if (n.P.glasses) n.P.glasses.style.display=L.glasses===false?'none':'';
    if (!m.skin && L.skin){ const sk=normColor(L.skin)||SKIN; n.g.style.setProperty('--skin',sk); n.g.style.setProperty('--skinD',shade(sk,.93)); }
    if (base){ const o=normColor(L.outfit)||outfit, pt=normColor(L.pants)||pants; dressNPC(n,o,pt); n.P.hairBack.innerHTML=hairSVG(L,'back'); n.P.hairFront.innerHTML=hairSVG(L,'front'); [n.P.thL2,n.P.thR2].forEach(e=>e.style.display=pt!=='#8fa9c9'?'none':''); } }
  n.P.hairBack.style.display=n.P.hairFront.style.display=m.hideHair?'none':'';
}
/* replay the other player's script on their character (simplified but faithful) */
async function npcRun(n, steps){
  if (!n) return; n.running=true; setTimeout(()=>{ n.running=false; }, 15000); const my=++n.runId||(n.runId=1); n.runId=my;
  for (const s of (steps||[]).slice(0,26)){
    if (n.runId!==my || !n.g.isConnected) return;
    const d=String(s.do||'');
    try {
      if (d==='goto'||d==='walk'||d==='run'){ const o=OBJ[s.object]; const room=o?o.room:(s.room||n.room); if (room!==n.room){ n.room=room; n.X = n.X<240?-40:520; } await npcWalk(n, o?o.x:(typeof s.x==='number'?s.x:240)); }
      else if (d==='act'||d==='pose'){ const o=OBJ[s.at]; if (o && o.room===n.room) { await npcWalk(n, (o.seat||o.lie||o).x); }
        if (s.pose==='custom' && Array.isArray(s.frames)){ const cp=customPose(s); if (cp){ n.pose=cp; n.poseStart=performance.now(); } } else npcPose(n, POSES[s.pose]?s.pose:'idle', s.face);
        if (s.say) npcSay(n, s.say); await sleep(clamp(+s.ms||2400,300,8000)); npcPose(n,'idle'); }
      else if (d==='costume'||d==='outfit'){ const c={...s}; delete c.do; if (d==='outfit'&&s.color) c.outfit=s.color; npcCostume(n,c); await sleep(500); }
      else if (d==='say'){ npcSay(n, s.text||s.say||''); await sleep(1500); }
      else if (d==='appear'){ if (s.room) n.room=s.room; n.X=clamp(+s.x||240,20,460); n.alpha=1; }
      else if (d==='vanish'){ n.alpha=0.1; await sleep(600); }
      else if (d==='leap'){ const o=OBJ[s.object]; n.X=o?(o.sill||o).x:(+s.x||n.X); }
      else if (d==='wait'){ await sleep(clamp(+s.ms||800,100,4000)); }
      else if (d==='refuse'){ npcPose(n,'no'); npcSay(n, s.say||'Nope.'); await sleep(2000); npcPose(n,'idle'); }
    } catch(e){}
  }
}
function otherTopic(){ return H.visit ? H.visit.topic : H.guest ? H.guest.topic : null; }
function shareScript(steps){ const t=otherTopic(); if (t) sendTo(t, {t:'script', steps:steps.slice(0,26), room:H.room, x:Math.round(H.X)}); }
async function goVisit(name, code){
  const key=keyOf(name); code=String(code||'').replace(/\D/g,'').slice(0,3);
  if (code.length!==3){ say(tr('needcode'),3500); return; }
  if (key===keyOf(H.name) && code===H.code){ say(LANG==='it'?'Sono già a casa mia.':'I\'m already home.',2500); return; }
  if (H.visit){ say(LANG==='it'?'Sono già fuori casa.':'I\'m already out.',2500); return; }
  const id=++runId; await gotoRoom('living', -60, id);
  H.pendingVisit={topic:topicOf(name,code), name:String(name).slice(0,18)};
  say(LANG==='it'?`Din don! Busso da ${name}…`:`Ding dong! Knocking at ${name}'s…`, 4000);
  const ok=await sendTo(H.pendingVisit.topic, {t:'knock', code:H.code, kind:H.kind, look:lookOut()});
  if (!ok){ H.pendingVisit=null; say(tr('nosignal')); }
  const ref=H.pendingVisit; setTimeout(()=>{ if (H.pendingVisit===ref){ H.pendingVisit=null; H.X=-60; walkTo(240, ++runId); say(LANG==='it'?'Non c\'è nessuno. Torno a casa.':'Nobody home. Going back.',3000); } }, 30000);
}
function enterHouse(d){
  const pv=H.pendingVisit; if (!pv || pv.topic!==d.fromTopic) return;
  H.pendingVisit=null; H.visit={topic:pv.topic, name:pv.name, kind:d.kind||'m'}; H.visitDeco=d.deco||{}; if (PLACES[H.room]) leavePlace();
  const id=++runId;
  setRoom(d.room&&ROOMS[d.room]?d.room:'living'); H.X=-60; H.Y=LANE;
  hostNPC = makeNPC({name:pv.name, kind:d.kind||'m', room:H.room, x:clamp(+d.x||300,40,440), outfit:d.outfit});
  if (d.look) npcLook(hostNPC, d.look); if (d.costume) npcCostume(hostNPC, d.costume);
  hostNPC.topic=pv.topic; hostNPC.dir=-1; npcSay(hostNPC, LANG==='it'?'Entra pure!':'Come in!');
  walkTo(160, id).then(()=>say(LANG==='it'?`Ciao ${pv.name}!`:`Hi ${pv.name}!`,2500));
  houseLabel(); openChatWith(pv.topic, pv.name);
}
function houseLabel(){
  const R=ROOMS[H.room]; const who = H.visit ? (LANG==='it'?` · CASA DI ${H.visit.name.toUpperCase()}`:` · ${H.visit.name.toUpperCase()}'S HOUSE`) : '';
  $('camName').textContent=`REC · CAM ${R.cam} · ${R.name}${who}`;
}
function leaveVisit(silent){
  if (!H.visit) return;
  const t=H.visit.topic; if (!silent) sendTo(t,{t:'leave'});
  if (hostNPC){ removeNPC(hostNPC); hostNPC=null; }
  H.visit=null; H.visitDeco=null; const id=++runId; setRoom('living'); drawRoom('living'); H.X=-60; H.Y=LANE; walkTo(200,id).then(()=>say(LANG==='it'?'Casa dolce casa.':'Home sweet home.',2500));
}
function onVisitData(d){
  if (d.t==='knock'){
    if (H.guest || H.visit){ sendTo(d.fromTopic,{t:'busy'}); return; }
    H.knock={topic:d.fromTopic, name:String(d.from||'?').slice(0,18), kind:d.kind||'m', look:d.look};
    $('incomingTxt').textContent = LANG==='it' ? `🔔 ${H.knock.name} ${String(d.code||'')} è alla porta` : `🔔 ${H.knock.name} ${String(d.code||'')} is at the door`;
    $('btnAnswer').textContent = LANG==='it'?'Apri':'Open'; $('btnDecline').textContent = LANG==='it'?'Non aprire':'Ignore';
    $('incoming').classList.add('show');
    const id=++runId; (async()=>{ await standUp(id); await walkTo(60,id); say(LANG==='it'?'Chi è?':'Who is it?',2500); })();
    return true;
  }
  if (d.t==='enter'){ enterHouse(d); return true; }

function removeNPC(n){ const i=NPCS.indexOf(n); if(i>=0) NPCS.splice(i,1); n.g.remove(); if (n.sh) n.sh.remove(); }
function updateNPCs(dt, now){
  const k=1-Math.exp(-dt*16);
  for (const n of NPCS){
    const vis = n.room===H.room; n.g.style.display = vis?'':'none'; if (n.sh){ n.sh.style.display=vis?'':'none'; n.sh.setAttribute('cx',n.X.toFixed(1)); n.sh.setAttribute('cy',(n.Y+1).toFixed(1)); n.sh.setAttribute('opacity', n.alpha); } if(!vis) continue;
    const t={...samplePose(n.pose, now-n.poseStart)};
    for (const key in t) n.cur[key]+=(t[key]-n.cur[key])*k;
    const c=n.cur, P=n.P, s=BASE*(1+(n.Y-STAND)*0.006);
    n.g.setAttribute('opacity', n.alpha);
    n.g.setAttribute('transform',`translate(${n.X} ${n.Y}) scale(${n.dir*s*c.sx} ${s}) translate(0 ${c.y}) translate(0 ${-HIP}) rotate(${c.rot})`);
    P.legL.setAttribute('transform',`translate(-8 0) rotate(${c.lL})`); P.thL.setAttribute('transform',`scale(1 ${c.sL})`); P.thL2.setAttribute('transform',`scale(1 ${c.sL})`); P.knL.setAttribute('transform',`translate(0 ${26*c.sL}) rotate(${c.kL})`);
    P.legR.setAttribute('transform',`translate(8 0) rotate(${c.lR})`); P.thR.setAttribute('transform',`scale(1 ${c.sR})`); P.thR2.setAttribute('transform',`scale(1 ${c.sR})`); P.knR.setAttribute('transform',`translate(0 ${26*c.sR}) rotate(${c.kR})`);
    P.tor.setAttribute('transform',`rotate(${c.tor})`); P.head.setAttribute('transform',`translate(0 -46) rotate(${c.head})`);
    P.armL.setAttribute('transform',`translate(-17 -38) rotate(${c.aL})`); P.elL.setAttribute('transform',`translate(0 19) rotate(${c.eL})`);
    P.armR.setAttribute('transform',`translate(17 -38) rotate(${c.aR})`); P.elR.setAttribute('transform',`translate(0 19) rotate(${c.eR})`);
    if (n.say && now>n.sayUntil){ n.sayEl&&n.sayEl.remove(); n.say=null; }
    if (n.sayEl){ const hx=n.X, hy=Math.max(22, n.Y-(HIP+80)*s+c.y), w=n.sayW||80;
      let cx=clamp(hx, w/2+4, 476-w/2);
      if (hy<108 && cx+w/2>338) cx=Math.max(w/2+4, 338-w/2);          // keep clear of the map in the corner
      n.sayEl.setAttribute('transform',`translate(${cx} ${hy})`);
      const tl=n.sayEl.querySelector('.tail'); if (tl) tl.setAttribute('transform',`translate(${clamp(hx-cx,-w/2+8,w/2-8)} 0)`); }
  }
}
function npcSay(n, text, ms){

  const w=Math.min(250, 18+text.length*7.2);

async function npcWalk(n, x, id, again){
  x=freeSpot(x,n); n.destX=x;
  const dx=x-n.X; if (Math.abs(dx)<3) return; n.dir=dx>0?1:-1; npcPose(n,'walk');
  const ms=Math.abs(dx)/140*1000, t0=performance.now(), x0=n.X;
  await new Promise(res=>{ (function st(now){ if(id!=null && !alive(id)) return res(); const f=Math.min(1,(now-t0)/ms); n.X=x0+dx*f; if(f<1) requestAnimationFrame(st); else res(); })(performance.now()); });
  npcPose(n,'idle');
  if (!again && n.X>10 && n.X<470){ const x2=freeSpot(n.X,n); if (Math.abs(x2-n.X)>2) await npcWalk(n, x2, id, true); }
}


/* ===== Community WITHOUT Firebase: each phone keeps its own copy, changes travel through the free ntfy relay ===== */
(function(){
  if (CONFIG.FIREBASE && CONFIG.FIREBASE.apiKey) return;           // real Firebase configured → use it
  const LK='subservientDB';
  let DB={requests:{}, players:{}}; try { DB=Object.assign(DB, JSON.parse(localStorage.getItem(LK)||'{}')); } catch(e){}
  const save=()=>{ try{ localStorage.setItem(LK, JSON.stringify(DB)); }catch(e){} };
  const L={docs:[], qs:[]};
  const me=()=>topicOf(H.name,H.code);
  let nq=false; const notify=()=>{ if (nq) return; nq=true; setTimeout(()=>{ nq=false; for (const d of L.docs) try{ d(); }catch(e){} for (const q of L.qs) try{ q(); }catch(e){} },0); };
  const parties=r=>[r.from, r.to, ...(r.guests||[])].filter(t=>t && t!==me());
  const share=r=>{ for (const t of parties(r)) fetch(`${NTFY}/${t}-db`,{method:'POST',body:JSON.stringify({t:'db',doc:r})}).catch(()=>{}); };
  function merge(doc){
    if (!doc || !doc.id || typeof doc.id!=='string') return false;
    const old=DB.requests[doc.id]; if (old && (old.at||0)>(doc.at||0)) return false;
    if (old && JSON.stringify(old)===JSON.stringify(doc)) return false;
    DB.requests[doc.id]=doc; save(); return true;
  }
  const fakeSnap=d=>({exists:()=>!!d, data:()=>d});
  function profileOf(uid){
    if (uid===me()) return DB.players[uid];
    for (const r of Object.values(DB.requests)){
      if (r.from===uid) return {name:r.fromName, code:r.fromCode, kind:r.fromKind||'m'};
      if (r.to===uid) return {name:r.toName, code:r.toCode, kind:r.toKind||'m'};
    }
    return null;
  }
  let es2=null;
  function listenDB(){
    try{ if(es2) es2.close(); }catch(e){}
    const since=localStorage.getItem('subservientDBsince')||'12h';
    es2=new EventSource(`${NTFY}/${me()}-db/sse?since=${since}`);
    es2.onmessage=ev=>{ let m; try{ m=JSON.parse(ev.data); }catch(e){ return; } if (m.event!=='message') return;
      try{ localStorage.setItem('subservientDBsince', String(m.time)); }catch(e){}
      let d; try{ d=JSON.parse(m.message); }catch(e){ return; }
      if (d.t==='db' && merge(d.doc)) notify(); else if ((d.t==='prank'||d.t==='prankfail') && window.onPrankMsg) window.onPrankMsg(d); else if (d.t && typeof friendMsg==='function') friendMsg(d); };
  }
  window.FB={
    local:true,
    signIn: async()=>{ listenDB(); setTimeout(()=>{ const now=Date.now(); for (const r of Object.values(DB.requests)) if (now-(r.at||0)<60*864e5) share(r); }, 1500); return {user:{uid:me()}}; },
    signOut: async()=>{ try{ es2&&es2.close(); }catch(e){} },
    now: ()=>Date.now(),
    get: async([c,id])=> c==='players' ? fakeSnap(profileOf(id)) : c==='numbers' ? fakeSnap(null) : fakeSnap(DB[c]&&DB[c][id]),
    set: async([c,id],data,mergeIt)=>{ if (c==='numbers') return; DB[c]=DB[c]||{}; DB[c][id]=mergeIt?{...(DB[c][id]||{}),...data}:{...data}; save(); notify(); },
    update: async([c,id],data)=>{ const d={...(DB.requests[id]||{}),...data, id}; DB.requests[id]=d; save(); share(d); notify(); },
    add: async(c,data)=>{ const id=Date.now().toString(36)+Math.random().toString(36).slice(2,8); const d={...data,id}; DB.requests[id]=d; save(); share(d); notify(); return {id}; },
    del: async([c,id])=>{ if (DB[c]) { delete DB[c][id]; save(); } },
    listen: ([c,id],cb)=>{ const f=()=>cb(c==='players'&&id===me()?DB.players[me()]||{}:(DB[c]||{})[id]||null); L.docs.push(f); f(); },
    query: (c,field,val,cb)=>{ const f=()=>cb(Object.values(DB.requests).filter(r=>r[field]===(val===C.uid?me():val))); L.qs.push(f); f(); },
    queryContains: (c,field,val,cb)=>{ const f=()=>cb(Object.values(DB.requests).filter(r=>(r[field]||[]).includes(me()))); L.qs.push(f); f(); }
  };
  window.__fbLocal=true;
})();
/* ================= COMMUNITY (Firebase: anonymous sign-in + Firestore) ================= */
const C = { ready:false, uid:null, me:null, inbox:[], outbox:[], guestOf:[], partner:null, partnerNPC:null, seenWeddings:{} };
try { C.seenWeddings = JSON.parse(localStorage.getItem('subservientSeen')||'{}'); } catch(e){}
const numKey = (name, code) => `${keyOf(name)}-${code}`;
function fbReady(){ return !!window.FB; }
async function communityStart(){
  if (!fbReady()) { renderSocial(); return; }
  const F=window.FB;
  try {
    const cred = await F.signIn(); C.uid = cred.user.uid;
    // claim my number (name+code) — unique across the community
    const key=numKey(H.name,H.code);
    const old = C.myKey && C.myKey!==key ? C.myKey : null;
    const snap = await F.get(['numbers',key]);
    if (snap.exists() && snap.data().uid!==C.uid){ say(tr('taken'),4000); renderSocial(); return; }
    if (!snap.exists()) await F.set(['numbers',key], {uid:C.uid, name:H.name, code:H.code});
    if (old) { try { await F.del(['numbers',old]); } catch(e){} }
    C.myKey=key;
    await F.set(['players',C.uid], {name:H.name, code:H.code, kind:H.kind, outfit:H.kind==='f'?'#3f9a8c':'#d9a93b', number:key, seen:F.now()}, true);
    C.ready=true;
    F.listen(['players',C.uid], d=>{ C.me=d; refreshPartner(); renderSocial(); });
    F.query('requests','to',C.uid, list=>{ C.inbox=list; recompute(); });
    F.query('requests','from',C.uid, list=>{ C.outbox=list; recompute(); });
    F.queryContains('requests','guests',C.uid, list=>{ C.guestOf=list; checkWeddings(); renderSocial(); });
    setInterval(checkWeddings, 15000);
  } catch(e){ console.warn('community', e); renderSocial(tr('c_offline')); }
}
async function updateIdentity(){
  if (window.FB && window.FB.local){ C.uid=topicOf(H.name,H.code); await window.FB.signIn(); await window.FB.set(['players',C.uid],{name:H.name,code:H.code,kind:H.kind,number:numKey(H.name,H.code)},true); renderSocial(); return; }
  const F=window.FB, key=numKey(H.name,H.code);
  try {
    if (key!==C.myKey){
      const snap=await F.get(['numbers',key]);
      if (snap.exists() && snap.data().uid!==C.uid){ say(tr('taken'),4000); return; }
      if (!snap.exists()) await F.set(['numbers',key], {uid:C.uid, name:H.name, code:H.code});
      if (C.myKey) { try { await F.del(['numbers',C.myKey]); } catch(e){} }
      C.myKey=key;
    }
    await F.set(['players',C.uid], {name:H.name, code:H.code, kind:H.kind, number:key}, true);
  } catch(e){ console.warn(e); }
}
async function lookup(numberText){
  const m=String(numberText||'').trim().match(/^(.+?)\s*[-\s]\s*(\d{3})$/); if(!m) return null;
  if (window.FB && window.FB.local) return {uid:topicOf(m[1].trim(),m[2]), name:m[1].trim().slice(0,18), code:m[2], key:numKey(m[1],m[2])};
  const s=await window.FB.get(['numbers',numKey(m[1],m[2])]); return s.exists()? {uid:s.data().uid, name:s.data().name, code:s.data().code, key:numKey(m[1],m[2])} : null;
}
/* status is DERIVED from the accepted requests, so both sides always agree */
function deriveStatus(){
  const all=[...C.inbox,...C.outbox].filter(r=>r.status==='accepted').sort((a,b)=>(a.at||0)-(b.at||0));
  let st='single', partner=null, wedding=null;
  for (const r of all){
    const other = r.from===C.uid ? {uid:r.to,name:r.toName,code:r.toCode,kind:r.toKind} : {uid:r.from,name:r.fromName,code:r.fromCode,kind:r.fromKind};
    if (r.type==='date'){ st='dating'; partner=other; wedding=null; }
    else if (r.type==='propose' && partner && partner.uid===other.uid){ st='engaged'; }
    else if (r.type==='wedding' && partner && partner.uid===other.uid){ wedding=r; if ((r.when||0)<=Date.now()) st='married'; }
    else if (r.type==='breakup' && partner && partner.uid===other.uid){ st='single'; partner=null; wedding=null; }
  }
  return {st, partner, wedding};
}
async function recompute(){
  const {st, partner} = deriveStatus();
  if (C.ready && C.me && (C.me.status!==st || (C.me.partner||null)!==(partner?partner.uid:null))){
    try { await window.FB.set(['players',C.uid], {status:st, partner:partner?partner.uid:null, partnerName:partner?partner.name:null, partnerCode:partner?partner.code:null}, true); } catch(e){}
  }
  checkWeddings(); renderSocial();
}
function refreshPartner(){
  const st=C.me&&C.me.status, pu=C.me&&C.me.partner;
  const lives = pu && (st==='engaged'||st==='married');
  if (!lives){ if (C.partnerNPC){ removeNPC(C.partnerNPC); C.partnerNPC=null; } C.partner=null; return; }
  if (C.partner && C.partner.uid===pu) return;
  window.FB.get(['players',pu]).then(s=>{
    if (!s.exists()) return; const d=s.data(); C.partner={uid:pu, ...d};
    if (C.partnerNPC) removeNPC(C.partnerNPC);
    C.partnerNPC = makeNPC({name:d.name, kind:d.kind||'m', outfit:d.outfit, room:'living', x:360, role:'partner'});
  }).catch(()=>{});
}

/* social actions (from the panel or from commands) */
async function socialAction(action, numberText){
  if (!C.ready){ sheet(`<p>${tr('c_setup')}</p>`); return; }
  const {st, partner} = deriveStatus();
  if (action==='breakup'){ if(!partner){ say(tr('c_nopartner')); return; } await sendRequest('breakup', partner); say(tr('c_brokeup',partner.name)); runSmall('cry'); return; }
  if (action==='propose'){ if(st!=='dating'){ say(tr('c_needdating')); return; } await sendRequest('propose', partner); say(tr('c_proposed',partner.name)); runSmall('bow'); return; }
  if (action==='wedding'){ if(st!=='engaged'){ say(tr('c_needengaged')); return; } weddingForm(partner); return; }
  if (action==='date'){
    if (partner){ say(tr('c_taken')); return; }
    const t=await lookup(numberText); if(!t){ say(tr('c_nonumber')); return; } if (t.uid===C.uid){ say(tr('self')); return; }
    await sendRequest('date', t); say(tr('c_asked',t.name)); runSmall('kiss'); return;
  }
}

  }
  for (const r of C.outbox.filter(r=>r.status==='declined' && Date.now()-(r.at||0)<86400000)) rows.push(`<div class="req"><div class="muted">${esc(tr('c_declinedby', r.toName))}</div></div>`);
  sheet(`<h3>📬 ${tr('c_inbox')}</h3>${rows.length?rows.join(''):`<p class="muted">${tr('c_empty')}</p>`}<button class="ghost close" id="shClose">${tr('c_close')}</button>`);
  $('shClose').onclick=closeSheet;
  $('sheetBody').querySelectorAll('[data-ok]').forEach(b=>b.onclick=async()=>{ const r=C.inbox.find(x=>x.id===b.dataset.ok); if(r){ await answerRequest(r,true); celebrate(r); } closeSheet(); });
  $('sheetBody').querySelectorAll('[data-no]').forEach(b=>b.onclick=async()=>{ const r=C.inbox.find(x=>x.id===b.dataset.no); if(r) await answerRequest(r,false); closeSheet(); });
  $('sheetBody').querySelectorAll('[data-watch]').forEach(b=>b.onclick=()=>{ const w=C.guestOf.find(x=>x.id===b.dataset.watch); closeSheet(); if(w) playCeremony(w); });
}
function celebrate(r){
  const id=++runId;
  if (r.type==='date') runScript([{do:'act',pose:'kiss',ms:2200,say:LANG==='it'?'Sì! Ci sto.':'Yes! Count me in.'}], id);
  if (r.type==='propose') runScript([{do:'act',pose:'cheer',ms:2500,say:LANG==='it'?'Sì, lo voglio!':'Yes, I will!'}], id);
  if (r.type==='wedding') runScript([{do:'act',pose:'hug',ms:2200,say:LANG==='it'?'Ci sposiamo!':'We\'re getting married!'}], id);
}

/* ---------- the wedding ceremony (for the couple and the guests) ---------- */
let ceremonyOn=false;
function checkWeddings(){
  if (!C.ready || ceremonyOn) return;
  const mine=[...C.inbox,...C.outbox].filter(r=>r.type==='wedding'&&r.status==='accepted');
  const all=[...mine, ...C.guestOf.filter(r=>r.status==='accepted')];
  for (const w of all){
    if (C.seenWeddings[w.id]) continue;
    if ((w.when||0)<=Date.now() && Date.now()-(w.when||0)<7200000){ playCeremony(w); return; }
  }
}
async function playCeremony(w){
  if (ceremonyOn) return; ceremonyOn=true;
  C.seenWeddings[w.id]=1; try{ localStorage.setItem('subservientSeen', JSON.stringify(C.seenWeddings)); }catch(e){}
  const id=++runId; stopFx(); clearSpawns(true);
  const iAmSpouse = w.from===C.uid || w.to===C.uid;
  const temp=[];
  try {
    await gotoRoom('garden', 240, id); if(!alive(id)) return;
    caption.textContent = '💒 '+tr('c_weddingof', w.fromName+' & '+w.toName);
    spawn({id:'arch', x:240, y:STAND-4, svg:`<path d="M-46 0 L-46 -120 Q0 -175 46 -120 L46 0" fill="none" stroke="#fff" stroke-width="7"/><g fill="#ff9fb8">${Array.from({length:14},(_,i)=>{const a=Math.PI*(i/13); return `<circle cx="${Math.cos(a)*-46}" cy="${-120-Math.sin(a)*48}" r="6"/>`;}).join('')}</g><g fill="#fff">${Array.from({length:8},(_,i)=>`<circle cx="${i<4?-46:46}" cy="${-20-(i%4)*28}" r="5"/>`).join('')}</g>`, stay:true});
    let A, B;   // A = left spouse, B = right spouse
    const outfits = k => k==='f' ? {outfit:'#f7f7f2', pants:'#f7f7f2', hat:`<path d="M-17 -34 Q0 -44 17 -34 L22 10 Q0 4 -22 10 Z" fill="#fff" opacity=".55"/><g fill="#ff9fb8"><circle cx="-8" cy="-38" r="3"/><circle cx="0" cy="-41" r="3"/><circle cx="8" cy="-38" r="3"/></g>`} : {outfit:'#2b2f3a', pants:'#2b2f3a', torso:`<path d="M-7 -42 L0 -22 L7 -42 Z" fill="#fff"/><path d="M-4 -41 L0 -38 L4 -41 L4 -36 L0 -38 L-4 -36 Z" fill="#222"/>`};
    if (iAmSpouse){
      const myk=H.kind, other = w.from===C.uid ? {name:w.toName,kind:w.toKind||'f'} : {name:w.fromName,kind:w.fromKind||'m'};
      const o=outfits(myk); applyCostume({preset:'pajamas', outfit:o.outfit, pants:o.pants, hat:o.hat||'', torso:o.torso||''});
      await walkTo(212, id); H.dir=1;
      if (C.partnerNPC){ C.partnerNPC.busy=true; C.partnerNPC.room='garden'; C.partnerNPC.X=268; B=C.partnerNPC; }
      else { B=makeNPC({name:other.name, kind:other.kind, room:'garden', x:268}); temp.push(B); }
      const ob=outfits(B.kind); dressNPC(B, ob.outfit, ob.pants); costumeNPC(B, ob.hat, ob.torso); B.dir=-1; npcPose(B,'idle','happy');
    } else {
      const ka=w.fromKind||'m', kb=w.toKind||'f';
      A=makeNPC({name:w.fromName, kind:ka, room:'garden', x:212}); B=makeNPC({name:w.toName, kind:kb, room:'garden', x:268}); temp.push(A,B);
      const oa=outfits(ka), ob=outfits(kb); dressNPC(A,oa.outfit,oa.pants); costumeNPC(A,oa.hat,oa.torso); dressNPC(B,ob.outfit,ob.pants); costumeNPC(B,ob.hat,ob.torso);
      A.dir=1; B.dir=-1; npcPose(A,'idle','happy'); npcPose(B,'idle','happy');
      await walkTo(90, id); H.dir=1;
    }
    // guests (names from the invitation)
    const gn=(w.guestNames||[]).slice(0,8); const slots=[60,110,160,320,370,420,95,385];
    gn.forEach((name,i)=>{ if (!iAmSpouse && name===H.name) return; const g=makeNPC({name, kind:i%2?'f':'m', room:'garden', x:slots[i], y:STAND+16, outfit:['#3f6fd1','#c86ba8','#4f9a4a','#e07a32','#8a5ac8','#2f9a92','#d64545','#d4a62a'][i]}); g.dir = slots[i]<240?1:-1; temp.push(g); });
    await sleep(800); if(!alive(id)) return;
    const vow = LANG==='it'?'Sì, lo voglio.':'I do.';
    if (iAmSpouse){ setPose('idle','love'); say(vow,2200); await sleep(2300); npcSay(B, vow); npcFace(B,'love'); await sleep(2300); }
    else { npcSay(A, vow); npcFace(A,'love'); await sleep(2300); npcSay(B, vow); npcFace(B,'love'); await sleep(2300); }
    if(!alive(id)) return;
    if (iAmSpouse){ setPose('kiss'); npcPose(B,'kiss','kissy'); } else { npcPose(A,'kiss','kissy'); npcPose(B,'kiss','kissy'); setPose('clap'); }
    startFx('hearts'); startFx('confetti');
    temp.forEach(g=>{ if(g!==A && g!==B) npcPose(g, Math.random()<.5?'clap':'cheer'); });
    await sleep(3500); stopFx();
    if (iAmSpouse){ say(LANG==='it'?'Sposati. Ufficialmente.':'Married. Officially.',2500); await sleep(2600); }
    else { setPose('cheer'); await sleep(2000); }
  } finally {
    temp.forEach(removeNPC); despawn('arch');
    if (C.partnerNPC){ C.partnerNPC.busy=false; costumeNPC(C.partnerNPC,'',''); dressNPC(C.partnerNPC, C.partner&&C.partner.outfit); }
    ceremonyOn=false; recompute();
    if (alive(id)){ setPose('idle'); caption.textContent=tr('waiting'); }
  }
}

/* partner step for AI scripts */
async function partnerStep(s, id){
  const n=C.partnerNPC; if(!n) return;
  n.busy=true; if (n.room!==H.room){ n.room=H.room; n.X = H.X<240 ? 470 : 10; }
  const tx = typeof s.x==='number' ? clamp(s.x,20,460) : clamp(H.X + (H.X<240?55:-55), 20, 460);
  await npcWalk(n, tx, id); n.dir = H.X>n.X?1:-1;
  if (s.pose) npcPose(n, s.pose, s.face);
  if (s.say) npcSay(n, s.say);
  await sleep(clamp(+s.ms||1500, 300, 6000));
  n.busy=false;
}

/* ================= KEYBOARD-FRIENDLY LAYOUT =================
   The page always fits the visible area (above the on-screen keyboard), and the command box keeps focus so the keyboard stays open. */
(function(){
  // same layout with or without the keyboard: camera on top (whole room), command box right under it.
  // The page never scrolls, and the command box grabs focus back so the keyboard stays up.
  const cmdEl=$('cmd');
  const ready=()=>$('setup').classList.contains('hide');
  const keepTop=()=>{ if (window.scrollY || document.documentElement.scrollTop || document.body.scrollTop){ window.scrollTo(0,0); document.documentElement.scrollTop=0; document.body.scrollTop=0; } };
  window.addEventListener('scroll',keepTop,{passive:true});
  if (window.visualViewport){ const vv=window.visualViewport; const unpan=()=>{ if (vv.offsetLeft||vv.offsetTop) window.scrollTo(0,0); }; vv.addEventListener('scroll',unpan); vv.addEventListener('resize',unpan); }
  if (window.visualViewport){ window.visualViewport.addEventListener('resize',keepTop); window.visualViewport.addEventListener('scroll',keepTop); }
  cmdEl.addEventListener('focus',()=>{ keepTop(); setTimeout(keepTop,50); setTimeout(keepTop,300); });
  window.focusCmd=()=>{ if (ready()) { try { cmdEl.focus({preventScroll:true}); } catch(e){ cmdEl.focus(); } keepTop(); } };
  cmdEl.addEventListener('blur',()=>setTimeout(()=>{ const a=document.activeElement; if (ready() && (!a || a===document.body || a===cmdEl) && !$('callbox').contains(a)) focusCmd(); },0));
  // buttons must not steal focus from the command box: otherwise the keyboard re-opens mid-tap and the tap is lost
  document.querySelectorAll('#go, #chatF button').forEach(b=>{
    b.addEventListener('pointerdown', e=>e.preventDefault());
    b.addEventListener('mousedown', e=>e.preventDefault());
    b.addEventListener('touchstart', e=>{ e.preventDefault(); const f=b.closest('form'); if (f){ if (f.requestSubmit) f.requestSubmit(); else f.dispatchEvent(new Event('submit',{cancelable:true})); } }, {passive:false});
  });
  document.addEventListener('pointerdown',e=>{ if (!ready()) return; if (window.ADV && e.target.closest('#advText')) return; if (e.target.closest('input,button,label,#callbox,.incoming,.mynum,.kbd,.kbbar,.objmenu,.advbar,.sheet')) return; e.preventDefault();
    if (window.ADV){ avTap(e); return; }
    if (document.body.classList.contains('land') && e.target.closest('#cam')){ document.body.classList.add('kbhide'); setTimeout(()=>window.fitCam&&fitCam(),0); }
    if (e.target.closest('.mini')){ openMap(); return; }
    if (H.room==='piazza' || H.room==='barber'){ try { const pt=scene.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY; const sp=pt.matrixTransform(scene.getScreenCTM().inverse());
      if (H.room==='piazza' && sp.x>290 && sp.x<348 && sp.y>145 && sp.y<200){ openBoard(); return; }
      if (H.room==='barber' && sp.x>120 && sp.x<190 && sp.y>150 && sp.y<250){ openBarber(); return; } } catch(err){} }
    if (H.room==='woods' || H.room==='bisca'){ try { const pt=scene.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY; const sp=pt.matrixTransform(scene.getScreenCTM().inverse());
      if (H.room==='woods' && sp.x<72 && sp.y>70 && sp.y<255){ knockTree(); focusCmd(); return; }
      if (H.room==='bisca' && ((sp.x>380 && sp.y>130 && sp.y<245) || (sp.x>140 && sp.x<320 && sp.y>185 && sp.y<250))){ if (sp.x>380) window.__game='slot'; openCasino(); return; } } catch(err){} }
    const n = NPCS.find(x=>x.room===H.room && x.g.contains(e.target));
    const intro=x=>(LANG==='it'?'Sono ':'I\'m ')+x.name+(x.code?' '+x.code:'')+(x.role?', '+x.role[LANG==='it'?'it':'en']:'')+(x.bot?' 🤖':'');
    if (!n && holG.contains(e.target)){ say((LANG==='it'?'Sono ':'I\'m ')+H.name+' '+H.code, 2200); focusCmd(); return; }
    if (n) { n.dir=H.X>n.X?1:-1; npcSay(n, intro(n)); }
    if (n && n.topic){ openChatWith(n.topic, n.name); if (call) call.peerName=n.name; log('sys', (LANG==='it'?'Chat con ':'Chat with ')+n.name+(n.code?' '+n.code:'')); npcPose(n,'wave'); setTimeout(()=>npcPose(n,'idle'),1500); setTimeout(()=>{ try{ $('chatIn').focus({preventScroll:true}); }catch(err){} },60); return; }
    if (!n && e.target.closest('#cam') && !e.target.closest('.objmenu')){ try { const pt=scene.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY; const sp=pt.matrixTransform(scene.getScreenCTM().inverse());
      const dk=decoAt(sp.x,sp.y), ob=dk?null:objAt(sp.x,sp.y); if (ob||dk){ openObjMenu(ob, dk, sp.x, sp.y, e.clientX, e.clientY); return; } } catch(err){} }
    if (!e.target.closest('.objmenu')) closeObjMenu();
    if (n && n.bot){ npcPose(n,'wave','happy'); setTimeout(()=>{ const L=n.lines&&n.lines[LANG==='it'?'it':'en']; npcSay(n, n.passer?(LANG==='it'?'Che vuoi?':'What do you want?'):(L?L[Math.floor(Math.random()*L.length)]:pickLine('reply'))); },1800); setTimeout(()=>npcPose(n,'idle'),2400); }
    focusCmd(); });
})();


/* keep the chat panel right above the on-screen keyboard (Android + iPhone) */
(function(){
  const vv=window.visualViewport; if(!vv) return;
  const place=()=>{ const kb=Math.max(0, window.innerHeight - vv.height - vv.offsetTop); document.documentElement.style.setProperty('--kbd', (kb+8)+'px'); document.documentElement.style.setProperty('--vvh', vv.height+'px'); const l=$('log'); if(l) l.scrollTop=1e6; };
  vv.addEventListener('resize',place); vv.addEventListener('scroll',place); place();
  $('chatIn').addEventListener('focus',()=>setTimeout(place,250));
})();

  const mini=document.querySelector('.mini'); if (mini){ if (window.ADV) $('advbar').appendChild(mini); else info.appendChild(mini); mini.addEventListener('click',e=>{ e.stopPropagation(); if (window.ADV){ if (typeof avMap==='function' && !AV.busy) avMap(); } else openMap(); }); }

/* the camera always shows the WHOLE room: it gets smaller (same shape) when the keyboard or the chat need space */
(function(){
  const wrap=document.querySelector('.wrap'), camEl=$('cam');
  function fit(){
    const vv=window.visualViewport; const vh=vv?vv.height:innerHeight;
    const cs=getComputedStyle(document.body); const pad=parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom);
    const land = innerWidth>innerHeight && vh<600; document.body.classList.toggle('land', land);
    document.body.classList.toggle('chat', $('callbox').classList.contains('show'));
    wrap.style.height=(vh-pad)+'px';
    const hgt=el=>{ if (!el) return 0; const st=getComputedStyle(el); if (st.display==='none') return 0; return el.offsetHeight+parseFloat(st.marginTop)+parseFloat(st.marginBottom); };
    const others = hgt(document.querySelector('header.top')) + hgt($('callbox')) + hgt($('f')) + (document.body.classList.contains('adv')?(land?Math.max(120, vh*0.3):Math.min(300, Math.max(210, vh*0.36))):0) + hgt($('kbd')) + hgt(document.querySelector('.kbbar')) + (land?4:10);
    const fullW=wrap.clientWidth; let h=Math.max(100, Math.min(fullW/1.6, vh-pad-others)); let w=Math.min(fullW, h*1.6); h=w/1.6;
    const W=w.toFixed(1)+'px', Hh=h.toFixed(1)+'px'; if (camEl.style.width!==W) camEl.style.width=W; if (camEl.style.height!==Hh) camEl.style.height=Hh;
    document.body.classList.toggle('miniok', land && (fullW-w)/2 > 150);
    if (document.body.classList.contains('adv')){ const ab=$('advbar'); const free=vh-pad-hgt(document.querySelector('header.top'))-h-(land?16:44); const v=Math.max(land?120:190, free)+'px'; if (ab.style.height!==v) ab.style.height=v; }
  }
  window.fitCam=fit;
  if (window.visualViewport){ visualViewport.addEventListener('resize',fit); }
  addEventListener('resize',fit);
  new MutationObserver(()=>requestAnimationFrame(fit)).observe($('callbox'),{attributes:true,attributeFilter:['class']});
  setInterval(fit,700); fit();
})();
/* ================= BUILT-IN KEYBOARD (no phone keyboard, no suggestion bar) ================= */
const KB={ on:false, shift:false, caps:false, layer:'abc', target:null };
const KB_LAYERS={
  abc:[['q','w','e','r','t','y','u','i','o','p'],['a','s','d','f','g','h','j','k','l'],['⇧','z','x','c','v','b','n','m','⌫'],['123','àè','😀',' ','\'','⏎']],
  num:[['1','2','3','4','5','6','7','8','9','0'],['-','/',':',';','(',')','€','&','@','"'],['#+=','.',',','?','!','%','+','*','⌫'],['abc','àè','😀',' ','.','⏎']],
  sym:[['[',']','{','}','#','^','=','_','\\','|'],['~','<','>','$','£','¥','•','°','§','¿'],['123','.',',','?','!','\'','¡','€','⌫'],['abc','àè','😀',' ','.','⏎']],
  acc:[['à','è','é','ì','ò','ù','á','í','ó','ú'],['À','È','É','Ì','Ò','Ù','ç','ñ','ü','ö'],['⇧','\'','"','-','?','!',',','.','⌫'],['abc','123','😀',' ','.','⏎']],
  emo:[['😂','🤣','😍','😎','🙄','😡','😱','🤢','😴','🤡'],['👍','👎','👏','🙏','💪','🎉','❤️','🔥','💩','🍕'],['🍺','🍷','⚽','🎤','🎲','💰','🚗','🌧️','⌫'],['abc','123','àè',' ','.','⏎']]
};
function kbRender(){ const el=$('kbd'); if (!el) return; const L=KB_LAYERS[KB.layer]; try{ $('kbToggle').innerHTML = UI_IC('keys',16)+' '+(LANG==='it' ? 'usa la tastiera del telefono' : 'use the phone keyboard'); }catch(e){}
  el.innerHTML=L.map(row=>`<div class="kr">${row.map(k=>{ const cls=k===' '?'sp':(['⇧','⌫','123','abc','#+=','àè','😀','⏎'].includes(k)?'fn':''); const lab=k===' '?(LANG==='it'?'spazio':'space'):k==='⏎'?(LANG==='it'?'Invio':'Go'):(KB.layer==='abc'&&k.length===1&&(KB.shift||KB.caps)?k.toUpperCase():k);
    return `<div class="kk ${cls}${k==='⇧'&&(KB.shift||KB.caps)?' on':''}${k==='⏎'?' go':''}" data-k="${k.replace(/"/g,'&quot;')}">${lab==='⇧'&&KB.caps?'⇪':lab}</div>`; }).join('')}</div>`).join(''); }
function kbTarget(){ const t=KB.target; return (t && document.body.contains(t) && t.offsetParent!==null) ? t : $('cmd'); }
function kbInsert(ch){ const el=kbTarget(); const ml=+el.getAttribute('maxlength')||500; let s=el.selectionStart??el.value.length, e=el.selectionEnd??s;
  if (el.value.length-(e-s)+ch.length>ml) return; el.value=el.value.slice(0,s)+ch+el.value.slice(e); try{ el.setSelectionRange(s+ch.length,s+ch.length); }catch(x){} el.dispatchEvent(new Event('input',{bubbles:true})); }
function kbBack(){ const el=kbTarget(); let s=el.selectionStart??el.value.length, e=el.selectionEnd??s; if (s===e){ if (!s) return; const prev=[...el.value.slice(0,s)]; const cut=prev[prev.length-1].length; s-=cut; }
  el.value=el.value.slice(0,s)+el.value.slice(e); try{ el.setSelectionRange(s,s); }catch(x){} el.dispatchEvent(new Event('input',{bubbles:true})); }
function kbKey(k){
  if (navigator.vibrate) try{ navigator.vibrate(6); }catch(e){}
  const el=kbTarget(); if (document.activeElement!==el) try{ el.focus({preventScroll:true}); }catch(e){}
  if (k==='⌫'){ kbBack(); return; }
  if (k==='⏎'){ const f=el.form; if (f){ if (f.requestSubmit) f.requestSubmit(); else f.dispatchEvent(new Event('submit',{cancelable:true})); } return; }
  if (k==='⇧'){ const now=Date.now(); if (KB.shift && now-(KB.lastShift||0)<350){ KB.caps=true; KB.shift=false; } else if (KB.caps){ KB.caps=false; } else KB.shift=!KB.shift; KB.lastShift=now; kbRender(); return; }
  if (k==='123'){ KB.layer='num'; kbRender(); return; } if (k==='abc'){ KB.layer='abc'; kbRender(); return; } if (k==='#+='){ KB.layer='sym'; kbRender(); return; }
  if (k==='àè'){ KB.layer='acc'; kbRender(); return; } if (k==='😀'){ KB.layer='emo'; kbRender(); return; }
  let ch=k; if (KB.layer==='abc' && (KB.shift||KB.caps)) ch=k.toUpperCase();
  kbInsert(ch);
  if (KB.shift){ KB.shift=false; kbRender(); }
  if (KB.layer==='acc' || KB.layer==='emo'){ /* stay */ } else if (KB.layer!=='abc' && (k===' '||k==='.')) { KB.layer='abc'; kbRender(); }
}
function kbSetup(){
  const touch = window.matchMedia && matchMedia('(pointer:coarse)').matches;
  let pref='mine'; try{ pref=localStorage.getItem('subservientKb')||'mine'; }catch(e){}
  KB.on = touch && pref!=='native';
  const kb=$('kbd'); kb.style.display=KB.on?'':'none'; $('kbBack').style.display=(touch && !KB.on)?'':'none';
  ['cmd','chatIn'].forEach(id=>{ const el=$(id); if (KB.on) el.setAttribute('inputmode','none'); else el.removeAttribute('inputmode'); });
  $('kbToggle').innerHTML = UI_IC('keys',16)+' '+(LANG==='it' ? 'usa la tastiera del telefono' : 'use the phone keyboard');
  if (KB.on) kbRender();
  try{ window.fitCam && fitCam(); }catch(e){}
}
['cmd','chatIn'].forEach(id=>$(id).addEventListener('focus',()=>{ KB.target=$(id); }));
['cmd','chatIn'].forEach(id=>$(id).addEventListener('pointerdown',()=>{ if (document.body.classList.contains('kbhide')){ document.body.classList.remove('kbhide'); setTimeout(()=>window.fitCam&&fitCam(),0); } }));
setTimeout(()=>{ if (innerWidth>innerHeight && innerHeight<600) document.body.classList.add('kbhide'); }, 50);
addEventListener('orientationchange',()=>setTimeout(()=>{ if (innerWidth>innerHeight) document.body.classList.add('kbhide'); else document.body.classList.remove('kbhide'); window.fitCam&&fitCam(); },300));
$('chatIn').addEventListener('pointerdown',()=>{ KB.target=$('chatIn'); });
$('cmd').addEventListener('pointerdown',()=>{ KB.target=$('cmd'); });
(function(){ const kb=$('kbd'); let rep=null, repT=null;
  const stop=()=>{ clearTimeout(repT); clearInterval(rep); repT=rep=null; };
  kb.addEventListener('pointerdown',e=>{ const t=e.target.closest('.kk'); e.preventDefault(); if(!t) return; t.classList.add('dn'); setTimeout(()=>t.classList.remove('dn'),110); const k=t.dataset.k; kbKey(k);
    if (k==='⌫'){ repT=setTimeout(()=>{ rep=setInterval(()=>kbKey('⌫'),60); },420); } });
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>kb.addEventListener(ev,stop));
  kb.addEventListener('contextmenu',e=>e.preventDefault());
  $('kbToggle').addEventListener('pointerdown',e=>{ e.preventDefault(); try{ localStorage.setItem('subservientKb','native'); }catch(x){} kbSetup(); const el=kbTarget(); el.blur(); setTimeout(()=>el.focus(),60); });
  $('kbBack').addEventListener('pointerdown',e=>{ e.preventDefault(); try{ localStorage.setItem('subservientKb','mine'); }catch(x){} kbSetup(); const el=kbTarget(); el.blur(); setTimeout(()=>el.focus({preventScroll:true}),60); });
})();
kbSetup();

/* auto-update: when a new version is published, reload by itself (only if the player isn't typing) */
const BUILD='96';
try{ document.getElementById('ver').textContent='Versione '+BUILD; }catch(e){}
async function checkUpdate(){
  try { const r=await fetch('./?u='+Date.now(),{cache:'no-store'}); const t=await r.text(); const m=t.match(/const BUILD='([^']+)'/);
    if (m && m[1]!==BUILD){ const busy=()=>document.activeElement&&/^(cmd|chatIn)$/.test(document.activeElement.id)&&document.activeElement.value; if (!busy()) location.reload(); else setTimeout(checkUpdate,20000); } } catch(e){}
}
if (location.protocol.startsWith('http')){ document.addEventListener('visibilitychange',()=>{ if(!document.hidden) checkUpdate(); }); setInterval(checkUpdate, 5*60000); setTimeout(checkUpdate, 3000); }
