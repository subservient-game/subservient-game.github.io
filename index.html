<style>
  :root { --bg:#131519; --panel:#1c1f25; --line:#2d323a; --fg:#eef0f3; --muted:#8f97a2; --accent:#ffc83d; }
  * { box-sizing:border-box; }
  html, body { height:100%; width:100%; max-width:100vw; overflow:hidden; overscroll-behavior:none; touch-action:manipulation; }

  body { margin:0; background:radial-gradient(ellipse at top, #23272e 0%, var(--bg) 60%); color:var(--fg); font-family:"Fredoka", system-ui, -apple-system, sans-serif; min-height:100vh; display:flex; justify-content:center; align-items:flex-start; padding:8px 8px max(8px, env(safe-area-inset-bottom)); }
  .wrap { width:100%; max-width:760px; display:flex; flex-direction:column; }
  h1 { font-size:clamp(1.05rem, 4.4vw, 1.5rem); margin:0 2px 8px; font-weight:600; text-align:center; letter-spacing:.01em; }
  h1 span { color:var(--accent); }
  header.top { display:flex; align-items:center; justify-content:center; position:relative; margin-bottom:8px; }
  header.top h1 { margin:0; }
  .newbtn { position:absolute; left:0; background:var(--panel); border:1px solid var(--line); color:var(--fg); font-size:16px; padding:3px 10px; border-radius:999px; z-index:60; }
  .lang { position:absolute; right:0; display:flex; background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:2px; z-index:60; }
  .lang button { background:none; color:var(--muted); font-size:12px; padding:4px 9px; border-radius:999px; }
  .lang button.on { background:var(--accent); color:#1a1a1a; }
  .cam { position:relative; width:100%; flex:0 0 auto; aspect-ratio:16/10; border-radius:16px; overflow:hidden; background:#000; box-shadow:0 0 0 1px #000, 0 0 0 4px #2a2e35, 0 18px 40px rgba(0,0,0,.55); }
  .cam svg.scene { width:100%; height:100%; display:block; }
  .vignette { position:absolute; inset:0; pointer-events:none; background:radial-gradient(ellipse at center, transparent 64%, rgba(0,0,0,.32) 100%); }
  .hud { position:absolute; left:10px; top:8px; font-family:"JetBrains Mono", ui-monospace, monospace; font-size:clamp(8px, 2vw, 12px); line-height:1.45; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.85); pointer-events:none; }
  .rec::before { content:"●"; color:#ff453a; margin-right:5px; animation:blink 1.2s infinite steps(1); }
  @keyframes blink { 50% { opacity:0; } }
  .mini { position:absolute; right:8px; top:8px; width:24%; min-width:92px; background:rgba(12,14,18,.62); border-radius:8px; padding:4px; pointer-events:none; }
  .mini svg { display:block; width:100%; }
  .caption { position:absolute; left:0; right:0; bottom:9px; text-align:center; font-family:"JetBrains Mono", ui-monospace, monospace; font-size:clamp(9px, 2.3vw, 13px); color:#fff; text-shadow:0 1px 4px #000, 0 0 2px #000; pointer-events:none; padding:0 12px; }
  .bubble { position:absolute; left:50%; top:20%; max-width:min(78%, 340px); width:max-content; transform:translate(-50%,-100%) scale(.6); transform-origin:50% 100%; background:#fff; color:#15171a; font-weight:600; padding:6px 12px; border-radius:14px; font-size:clamp(11px, 3vw, 16px); line-height:1.25; overflow-wrap:anywhere; text-align:center; opacity:0; transition:opacity .18s, transform .22s cubic-bezier(.3,1.6,.5,1); pointer-events:none; box-shadow:0 4px 14px rgba(0,0,0,.3); z-index:3; }
  .bubble::after { content:""; position:absolute; left:50%; bottom:-6px; margin-left:-6px; border:6px solid transparent; border-bottom:0; border-top-color:#fff; }
  .bubble.show { opacity:1; transform:translate(-50%,-100%) scale(1); }
  .bubble.phone { background:#dff7e6; }
  .bubble.phone::after { border-top-color:#dff7e6; }
  .flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; }
  .flash.go { animation:flash .5s ease-out; }
  @keyframes flash { 0%{opacity:.95} 100%{opacity:0} }
  form.cmd { display:flex; gap:8px; margin-top:8px; flex:0 0 auto; }
  input { flex:1; min-width:0; font:inherit; font-size:16px; padding:14px 16px; border-radius:12px; border:1px solid var(--line); background:var(--panel); color:var(--fg); outline:none; transition:border-color .2s; }
  input:focus { border-color:var(--accent); }
  button { font:inherit; font-size:16px; font-weight:600; padding:12px 20px; border-radius:12px; border:0; background:var(--accent); color:#1a1a1a; cursor:pointer; }
  button.ghost { background:var(--panel); color:var(--fg); border:1px solid var(--line); }
  button.red { background:#ff453a; color:#fff; }
  button.green { background:#34c759; color:#fff; }

  /* onboarding */
  .setup { position:fixed; inset:0; background:rgba(10,12,16,.9); backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center; z-index:50; padding:16px; overflow-y:auto; }
  .setup.hide { display:none; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:20px; width:min(420px,100%); text-align:center; margin:auto; }
  .card h2 { font-size:1.4rem !important; }
  .card button#btnStart { padding:16px; font-size:18px; }
  .card h2 { margin:0 0 4px; font-size:1.15rem; }
  .card p { margin:0 0 12px; color:var(--muted); font-size:.85rem; }
  .pick { display:flex; gap:10px; margin-bottom:12px; }
  .pick button { flex:1; background:#262a31; color:var(--fg); border:2px solid transparent; padding:10px 6px; display:flex; flex-direction:column; align-items:center; gap:4px; }
  .pick button.on { border-color:var(--accent); }
  .pick svg { width:96px; height:96px; }
  .pick button { font-size:17px; padding:14px 6px !important; }
  .card input { width:100%; margin-bottom:12px; text-align:center; }

  /* phone */
  .incoming { position:absolute; left:50%; bottom:34px; transform:translateX(-50%); background:rgba(20,24,30,.92); border:1px solid #3a4250; border-radius:14px; padding:10px 14px; display:none; align-items:center; gap:10px; z-index:5; white-space:nowrap; font-size:clamp(12px,3vw,15px); }
  .incoming.show { display:flex; animation:shake .5s infinite; }
  @keyframes shake { 0%,100%{transform:translateX(-50%)} 25%{transform:translateX(calc(-50% - 2px))} 75%{transform:translateX(calc(-50% + 2px))} }
  .incoming button { padding:7px 12px; font-size:14px; }
  .keyl { display:flex; flex-direction:column; gap:4px; text-align:left; color:var(--muted); font-size:.85rem; margin:-4px 0 12px; }
  .keyl input { margin:0; padding:10px 12px; font-size:15px; }
  .keyl small { font-size:.75rem; }
  .codel { display:flex; align-items:center; gap:10px; margin:-4px 0 12px; color:var(--muted); font-size:.9rem; text-align:left; }
  .codel input { width:90px; margin:0; text-align:center; letter-spacing:.3em; font-weight:600; }
  .mynum { margin-top:8px; background:none; border:0; padding:4px 2px; color:var(--fg); font-size:.85rem; text-align:left; font-weight:500; }
  .mynum .muted { color:var(--muted); }
  .social { display:flex; gap:8px; flex-wrap:wrap; margin-top:4px; }
  .social button { background:var(--panel); color:var(--fg); border:1px solid var(--line); font-size:.85rem; padding:7px 12px; font-weight:500; }
  .social .muted { color:var(--muted); font-size:.82rem; }
  .badge { background:#ff453a; color:#fff; border-radius:999px; padding:0 6px; font-size:.75rem; }
  .sheet { position:fixed; inset:0; background:rgba(10,12,16,.75); display:none; align-items:flex-end; justify-content:center; z-index:70; padding:10px; }
  .sheet.show { display:flex; }
  .sheetBody { text-align:left; max-height:80vh; overflow:auto; }
  .sheetBody h3 { margin:0 0 8px; } .sheetBody p { color:var(--muted); font-size:.9rem; margin:0 0 10px; }
  .sheetBody .row { display:flex; gap:8px; margin-bottom:10px; } .sheetBody .row input { margin:0; padding:10px 12px; }
  .sheetBody .col { display:flex; flex-direction:column; gap:8px; margin-bottom:10px; }
  .sheetBody .fl { display:flex; flex-direction:column; gap:4px; font-size:.85rem; color:var(--muted); margin-bottom:10px; } .sheetBody .fl input { margin:0; padding:10px 12px; color-scheme:dark; }
  .sheetBody .close { width:100%; margin-top:4px; }
  .req { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:9px 0; border-bottom:1px solid var(--line); font-size:.92rem; }
  .req small { color:var(--muted); } .req .btns { display:flex; gap:6px; } .req .btns button { padding:6px 12px; font-size:14px; }
  .callbox { display:none; flex:0 0 auto; margin-top:8px; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:10px; }
  .callbox.show { display:block; }
  .callhead { display:flex; justify-content:space-between; align-items:center; font-weight:600; margin-bottom:8px; }
  .callhead button { padding:6px 12px; font-size:14px; }
  .log { max-height:22vh; overflow-y:auto; display:flex; flex-direction:column; gap:5px; margin-bottom:8px; font-size:.92rem; }
  .log div { padding:6px 10px; border-radius:12px; max-width:80%; }
  .log .me { align-self:flex-end; background:#3a4a2a; }
  .log .them { align-self:flex-start; background:#2a3442; }
  .log .sys { align-self:center; color:var(--muted); font-size:.8rem; background:none; }
  .callbox form { display:flex; gap:8px; }
  .callbox input { padding:10px 12px; }
  .callbox form button { padding:10px 14px; }

  .ln { fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .outfit { fill:var(--outfit); }
  .outfitD { fill:var(--outfitD); }
  .pants { fill:var(--pants); }
  .skin { fill:var(--skin); }
  .skinD { fill:var(--skinD); }
  .tvon { animation:tvcol 1.8s infinite steps(1); }
  @keyframes tvcol { 0%{fill:#4a90c9} 20%{fill:#7fbf5a} 40%{fill:#c95a8a} 60%{fill:#e3c35a} 80%{fill:#5ac9c1} }
  .flick { transform-box:fill-box; transform-origin:50% 100%; animation:flick .25s infinite alternate; }
  @keyframes flick { from{opacity:.75; transform:scaleY(.9)} to{opacity:1; transform:scaleY(1.1)} }
  .floatUp { animation:floatUp 1.8s ease-out forwards; }
  @keyframes floatUp { from{transform:translate(0,0); opacity:1} to{transform:translate(16px,-55px); opacity:0} }
  .drop { animation:drop .7s ease-in forwards; }
  @keyframes drop { from{transform:translateY(0); opacity:1} to{transform:translateY(60px); opacity:0} }
  .rise { animation:rise 1.8s ease-out forwards; }
  @keyframes rise { from{transform:translate(0,0) scale(.6); opacity:.85} to{transform:translate(8px,-60px) scale(1.4); opacity:0} }
  .conf { transform-box:fill-box; transform-origin:center; animation:conf 2.2s linear forwards; }
  @keyframes conf { from{transform:translateY(0) rotate(0)} to{transform:translateY(320px) rotate(720deg)} }
  .swirl { transform-box:fill-box; transform-origin:center; animation:swirl 1s ease-in forwards; }
  @keyframes swirl { from{transform:rotate(0) scale(1); opacity:1} to{transform:rotate(540deg) scale(.1); opacity:0} }
  .poof { transform-box:fill-box; transform-origin:center; animation:poof .7s ease-out forwards; }
  @keyframes poof { from{transform:scale(.3); opacity:.95} to{transform:scale(1.6); opacity:0} }
  #clouds { animation:drift 80s linear infinite; }
  @keyframes drift { from{transform:translateX(-60px)} to{transform:translateX(160px)} }
  .fxt { font-family:"Fredoka", sans-serif; font-weight:600; }
  .an-bob { animation:anbob 1.2s ease-in-out infinite; }
  @keyframes anbob { 50% { transform:translateY(-6px); } }
  .an-spin { transform-box:fill-box; transform-origin:center; animation:anspin 2s linear infinite; }
  @keyframes anspin { to { transform:rotate(360deg); } }
  .an-wobble { transform-box:fill-box; transform-origin:50% 100%; animation:anwob .8s ease-in-out infinite; }
  @keyframes anwob { 0%,100%{transform:rotate(-5deg)} 50%{transform:rotate(5deg)} }
  .an-pulse { transform-box:fill-box; transform-origin:center; animation:anpulse 1s ease-in-out infinite; }
  @keyframes anpulse { 50% { transform:scale(1.08); } }
</style>
</head>
<body>
<div class="wrap">
    <div class="setup" id="setup">
    <div class="card">
      <h2 data-i="who">Who lives here?</h2>
      <p data-i="pickTxt">Pick your tenant and give them a name. Friends who know the name can phone them.</p>
      <div class="pick">
        <button type="button" data-k="m" class="on"><svg viewBox="-28 -104 56 108" id="pvM"></svg>Holgen</button>
        <button type="button" data-k="f"><svg viewBox="-28 -104 56 108" id="pvF"></svg>Holga</button>
      </div>
      <input id="nameIn" maxlength="18" data-ip="name" placeholder="Name" value="Holgen" aria-label="Name">
      <label class="codel"><span data-i="yourcode">Your 3-digit code</span><input id="codeIn" inputmode="numeric" pattern="[0-9]*" maxlength="3" aria-label="Code"></label>
      <button id="btnStart" style="width:100%" data-i="movein">Move in</button>
      <div id="setupMore" style="display:none;margin-top:10px"><button type="button" class="ghost" id="btnCancelSetup" style="width:100%;margin-bottom:8px" data-i="cancel">Cancel</button><button type="button" class="ghost" id="btnReset" style="width:100%;color:#ff8a80" data-i="restartAll">Start over from scratch</button></div>
    </div>
  </div>

  <header class="top"><button type="button" id="btnNew" class="newbtn" aria-label="Change tenant">⟳</button><h1 id="title">Subservient <span>Holgen</span></h1><div class="lang"><button type="button" data-l="en">EN</button><button type="button" data-l="it">IT</button></div></header>
  <div class="cam" id="cam">
    <svg class="scene" id="scene" viewBox="0 0 480 300" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fbbe6"/><stop offset="1" stop-color="#d8eef8"/></linearGradient>
        <linearGradient id="gWood" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7a5434"/><stop offset="1" stop-color="#4c321e"/></linearGradient>
        <linearGradient id="gFloorWood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a6644"/><stop offset="1" stop-color="#5b3f27"/></linearGradient>
        <linearGradient id="gSofa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f7a8c"/><stop offset="1" stop-color="#355766"/></linearGradient>
        <linearGradient id="gCurtain" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b0573f"/><stop offset=".5" stop-color="#cf7357"/><stop offset="1" stop-color="#b0573f"/></linearGradient>
        <linearGradient id="gLeaf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6aa84f"/><stop offset="1" stop-color="#3f7a33"/></linearGradient>
        <linearGradient id="gPot" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c8743f"/><stop offset="1" stop-color="#94512a"/></linearGradient>
        <linearGradient id="gGrass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#79b956"/><stop offset="1" stop-color="#4c8a35"/></linearGradient>
        <linearGradient id="gPorcelain" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9e2e6"/></linearGradient>
        <linearGradient id="gSteel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f1f4f7"/><stop offset="1" stop-color="#c3ccd4"/></linearGradient>
        <radialGradient id="gGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff3c4" stop-opacity=".8"/><stop offset="1" stop-color="#fff3c4" stop-opacity="0"/></radialGradient>
        <radialGradient id="gBlueGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#9fd4ff" stop-opacity=".8"/><stop offset="1" stop-color="#9fd4ff" stop-opacity="0"/></radialGradient>
        <radialGradient id="gFireGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffb347" stop-opacity=".8"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
        <pattern id="stripes" width="18" height="18" patternUnits="userSpaceOnUse"><rect width="9" height="18" fill="#000" opacity=".035"/></pattern>
        <pattern id="tiles" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1"/></pattern>
        <pattern id="checker" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#e9e4da"/><rect width="12" height="12" fill="#c9c1b2"/><rect x="12" y="12" width="12" height="12" fill="#c9c1b2"/></pattern>
        <pattern id="bathFloor" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#eef3f4"/><rect width="10" height="10" fill="#cdd9dc"/><rect x="10" y="10" width="10" height="10" fill="#cdd9dc"/></pattern>

        <clipPath id="winB"><rect x="62" y="42" width="76" height="62"/></clipPath>
      </defs>
      <g id="back"></g>
      <g id="spawnB"></g>
      <rect id="darkOv" width="480" height="300" fill="#070b18" opacity="0" pointer-events="none"/>
      <ellipse id="shadow" cx="240" cy="258" rx="26" ry="5" fill="#000" opacity=".28" filter="url(#soft)"/>
      <g id="npcs"></g>
      <g id="hol"></g>
      <g id="front"></g>
      <g id="spawnF"></g>
      <g id="fx"></g>
    </svg>
    <div class="vignette"></div>
    <div class="flash" id="flash"></div>
    <div class="hud"><div class="rec" id="camName">REC · CAM 1 · LIVING ROOM</div><div id="clock"></div></div>
    <div class="mini"><svg id="mini" viewBox="0 0 104 70"></svg></div>
    <div class="bubble" id="bubble"></div>
    <div class="caption" id="caption"></div>
    <div class="incoming" id="incoming"><span id="incomingTxt">📞 Incoming call</span><button class="green" id="btnAnswer" data-i="answer">Answer</button><button class="red" id="btnDecline" data-i="decline">Decline</button></div>
  </div>
  <form class="cmd" id="f" autocomplete="off">
    <input id="cmd" maxlength="200" placeholder="Tell Holgen what to do…" aria-label="Command">

<script>
/* ======================= SETTINGS (edit me) =======================
   GEMINI_KEY: optional free key from https://aistudio.google.com/apikey
   (restrict it to your site's address in Google Cloud > Credentials).
   Leave '' to use only the free Pollinations service + built-in commands. */
const CONFIG = {
  /* POLLINATIONS_KEY: free "publishable" key (starts with pk_) from https://enter.pollinations.ai — sign in with GitHub, create a Publishable key, paste it here. */
  POLLINATIONS_KEY: '',
  GEMINI_KEY: '',
  GEMINI_MODEL: 'gemini-flash-latest',
  PREFER_GEMINI: true,
  AI_PER_HOUR: 300,  // max AI commands per phone per hour (Google's own free limits still apply)
  /* FIREBASE: paste here the config of your free Firebase project (see the guide). Leave {} to play without the community. */
  FIREBASE: {}
};
window.CONFIG = CONFIG;
</script>
<script type="module">
/* Firebase helpers (only used if CONFIG.FIREBASE is filled in) */
const cfg = (window.CONFIG||{}).FIREBASE;
if (cfg && cfg.apiKey){
  const V='10.12.2';
  const app = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
  const au  = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);
  const fs  = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
  const a = app.initializeApp(cfg); const auth = au.getAuth(a); const db = fs.getFirestore(a);
  const ref = p => fs.doc(db, ...p);
  const rows = snap => snap.docs.map(d=>({id:d.id, ...d.data()}));
  window.FB = {
    signIn: () => au.signInAnonymously(auth),
    signOut: () => au.signOut(auth),
    get: p => fs.getDoc(ref(p)),
    set: (p, data, merge) => fs.setDoc(ref(p), data, merge?{merge:true}:{}),
    update: (p, data) => fs.updateDoc(ref(p), data),
    add: (c, data) => fs.addDoc(fs.collection(db, c), data),
    del: p => fs.deleteDoc(ref(p)),
    now: () => Date.now(),
    listen: (p, cb) => fs.onSnapshot(ref(p), s=>cb(s.exists()?s.data():null), e=>console.warn(e)),
    query: (c, field, val, cb) => fs.onSnapshot(fs.query(fs.collection(db,c), fs.where(field,'==',val)), s=>cb(rows(s)), e=>console.warn(e)),
    queryContains: (c, field, val, cb) => fs.onSnapshot(fs.query(fs.collection(db,c), fs.where(field,'array-contains',val)), s=>cb(rows(s)), e=>console.warn(e))
  };
  window.dispatchEvent(new Event('fb-ready'));
}
</script>

function applyCostume(c){
  if (typeof c==='string') c = {preset:c};
  const base = COST[c.preset] || {};
  const m = {...base, ...c};
  const isF=H.kind==='f';
  const skin = normColor(m.skin)||SKIN;
  const outfit = m.outfit==='@skin'?skin:(normColor(m.outfit)||(isF?'#3f9a8c':'#d9a93b'));
  const pants = m.pants==='@skin'?skin:(normColor(m.pants)||'#8fa9c9');
  setColors(outfit, pants, skin);
  const fill=s=>sanitizeSVG(String(s||'').replace(/@INITIAL/g, esc((H.name||'H')[0].toUpperCase())));
  J.cHat.innerHTML=fill(m.hat); J.cFace.innerHTML=fill(m.face);
  J.cTorso.innerHTML=fill(isF ? (m.torsoF||m.torso) : (m.torsoM||m.torso));
  J.cBack.innerHTML=fill(m.back);
  J.hairBack.style.display = J.hairFront.style.display = m.hideHair ? 'none' : '';
  J.cardi.style.display = m.hideCardi ? 'none' : '';
  [J.thL2,J.thR2].forEach(e=>e.style.display = (m.pants && m.pants!=='#8fa9c9') ? 'none' : '');
  holG.querySelectorAll('#knL > rect:nth-child(2), #knR > rect:nth-child(2)').forEach(e=>e.style.display = (m.pants && m.pants!=='#8fa9c9') ? 'none' : '');
  H.costume = c.preset && COST[c.preset] ? c.preset : 'custom';
  if (c.preset==='pajamas' && !c.outfit && !c.hat) H.costume='pajamas';
}

/* SVG sanitizer for costumes / spawned objects written by Claude */
const SAFE_TAGS = new Set(['g','path','rect','circle','ellipse','line','polyline','polygon','text','tspan','lineargradient','radialgradient','stop','defs']);
function sanitizeSVG(str){
  if (!str) return '';
  str=String(str).slice(0,9000);
  const doc = new DOMParser().parseFromString(`<svg xmlns="http://www.w3.org/2000/svg">${str}</svg>`, 'image/svg+xml');
  if (doc.querySelector('parsererror')) return '';
  const root=doc.documentElement;
  (function walk(node){
    for (const ch of [...node.children]){
      if (!SAFE_TAGS.has(ch.tagName.toLowerCase())) { ch.remove(); continue; }
      for (const a of [...ch.attributes]){
        const n=a.name.toLowerCase(), v=a.value.toLowerCase();
        if (n.startsWith('on') || n.includes('href') || (n==='style' && (v.includes('url(')&&!v.includes('url(#') || v.includes('expression') || v.includes('javascript'))) || v.includes('javascript:')) ch.removeAttribute(a.name);
      }
      walk(ch);
    }
  })(root);
  return [...root.childNodes].map(n=>new XMLSerializer().serializeToString(n)).join('').replace(/ xmlns="http:\/\/www\.w3\.org\/2000\/svg"/g,'');
}

/* ================= ANIMATION LOOP ================= */
const cur = {...N}; let tgt={...N};
let pose=POSES.idle, poseStart=performance.now(), last=performance.now();
function setPose(nameOrPose, face){
  const p = typeof nameOrPose==='object' ? nameOrPose : (POSES[nameOrPose]||POSES.idle);
  pose=p; H.pose = typeof nameOrPose==='string' && POSES[nameOrPose] ? nameOrPose : 'custom'; poseStart=performance.now();
  setFace(face || p.face || 'normal');
}
function samplePose(p, t){
  const fr=p.frames, n=fr.length; if(n===1) return fr[0];
  if (p.once){ const total=p.dur*(n-1); if(t>=total) return fr[n-1]; const i=Math.floor(t/p.dur), f=(t%p.dur)/p.dur; return mix(fr[i],fr[i+1],ease(f)); }
  const i=Math.floor(t/p.dur)%n, f=(t%p.dur)/p.dur, j=(i+1)%n;
  return p.steps ? fr[i] : mix(fr[i],fr[j],ease(f));
}
const ease=f=>(1-Math.cos(Math.PI*f))/2;
function mix(a,b,f){ const o={}; for(const k in a) o[k]=a[k]+(b[k]-a[k])*f; return o; }
let blinkT=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  tgt={...samplePose(pose, now-poseStart)};
  if (H.seat && !pose.lie){ Object.assign(tgt, SIT); const sl=OBJ[H.seat].seat.legs; if (sl) Object.assign(tgt, sl); }
  if (H.lying && pose.lie){ const L=OBJ[H.lying].lie; if (L&&L.bend){ tgt.kL=L.bend; tgt.kR=L.bend; tgt.lL=2; tgt.lR=-2; } }
  if (H.prop && !pose.usesR){ tgt.aR=-14; tgt.eR=150; }
  const k = 1-Math.exp(-dt*16);
  for (const key in tgt){ cur[key]+= (tgt[key]-cur[key])*k; }
  if (pose.once && Math.abs(Math.abs(tgt.rot)-360)<.01 && Math.abs(cur.rot-tgt.rot)<2){ cur.rot=0; pose.frames[pose.frames.length-1].rot=0; }
  apply();
  if (curFace==='normal' && now>blinkT){ J.eyes.setAttribute('transform','translate(0 -17) scale(1 .12) translate(0 17)'); setTimeout(()=>J.eyes.removeAttribute('transform'),120); blinkT=now+rnd(2500,5000); }
  updateNPCs(dt, now);
  updateCamera(dt);
  positionBubble();
  requestAnimationFrame(frame);
}
/* camera: on tall/narrow screens show a slice of the room and follow the tenant */
let camX=240, vbKey='';
function updateCamera(dt){
  const r=cam.getBoundingClientRect(); if(!r.width||!r.height) return;
  const ratio=r.width/r.height; let w=480, h=300, y=0;
  if (ratio<1.6){ w=Math.max(150, 300*ratio); } else { h=480/ratio; y=300-h; }
  const target=clamp(H.X - (H.lying?28:0), w/2, 480-w/2);
  camX += (target-camX)*(dt>0?Math.min(1,dt*4):1);
  const x=clamp(camX-w/2,0,480-w);
  const key=`${x.toFixed(1)} ${y.toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}`;
  if (key!==vbKey){ vbKey=key; scene.setAttribute('viewBox',key); }
}
function depth(){ return (H.seat||H.lying) ? 1 : 1+(H.Y-STAND)*0.006; }
function apply(){
  const s=H.zoom*H.size*BASE*depth();
  holG.setAttribute('opacity', H.alpha);
  holG.setAttribute('transform',`translate(${H.X} ${H.Y}) scale(${H.dir*s*cur.sx} ${s}) translate(0 ${cur.y}) translate(0 ${-HIP}) rotate(${cur.rot})`);
  J.legL.setAttribute('transform',`translate(-8 0) rotate(${cur.lL})`); J.thL.setAttribute('transform',`scale(1 ${cur.sL})`); J.thL2.setAttribute('transform',`scale(1 ${cur.sL})`); J.knL.setAttribute('transform',`translate(0 ${26*cur.sL}) rotate(${cur.kL})`);
  J.legR.setAttribute('transform',`translate(8 0) rotate(${cur.lR})`); J.thR.setAttribute('transform',`scale(1 ${cur.sR})`); J.thR2.setAttribute('transform',`scale(1 ${cur.sR})`); J.knR.setAttribute('transform',`translate(0 ${26*cur.sR}) rotate(${cur.kR})`);
  J.tor.setAttribute('transform',`rotate(${cur.tor})`);
  J.head.setAttribute('transform',`translate(0 -46) rotate(${cur.head})`);
  J.armL.setAttribute('transform',`translate(-17 -38) rotate(${cur.aL})`); J.elL.setAttribute('transform',`translate(0 19) rotate(${cur.eL})`);
  J.armR.setAttribute('transform',`translate(17 -38) rotate(${cur.aR})`); J.elR.setAttribute('transform',`translate(0 19) rotate(${cur.eR})`);
  J.propR.style.display = H.lying ? 'none' : '';
  const p=PROPS[H.prop]; const pi=$('propInner');
  if (pi) pi.setAttribute('transform', `translate(0 21) ${p&&p.up?`rotate(${-(cur.rot+cur.tor+cur.aR+cur.eR)})`:''}`);
  const onFloor = !H.seat && !H.lying && H.Y>=STAND-14 && Math.abs(cur.rot)<30;
  const lift = Math.max(0,-cur.y);
  shadowEl.setAttribute('cx',H.X); shadowEl.setAttribute('rx', Math.max(8,26*s/BASE - lift*.25));
  shadowEl.setAttribute('cy', H.Y+2);
  shadowEl.setAttribute('opacity', H.alpha<.5 ? 0 : onFloor ? Math.max(.08,.28 - lift*.003) : (Math.abs(cur.rot)>60 && !H.lying? .2 : 0));
}

let bubbleUntil=0;
function say(text, ms, phone){ if(!text) return; bubble.textContent=text; bubble.classList.toggle('phone',!!phone); bubble.classList.add('show'); bubbleUntil=performance.now()+(ms||Math.min(6000,1500+String(text).length*55)); }
function positionBubble(){
  if (!bubble.classList.contains('show')) return;
  if (performance.now()>bubbleUntil){ bubble.classList.remove('show'); return; }
  // keep the WHOLE bubble inside the camera frame, whatever the tenant is doing
  const hr=J.head.getBoundingClientRect(), cr=cam.getBoundingClientRect();
  const bw=bubble.offsetWidth, bh=bubble.offsetHeight, pad=6;
  let cx = hr.left + hr.width/2 - cr.left;
  let bottom = hr.top - cr.top - 8;                      // tail just above the head
  if (bottom - bh < pad) bottom = Math.min(cr.height - pad, Math.max(bh + pad, hr.bottom - cr.top + bh + 10)); // no room above: put it beside/below the head
  bottom = Math.max(bh + pad, Math.min(cr.height - pad, bottom));
  cx = Math.max(bw/2 + pad, Math.min(cr.width - bw/2 - pad, cx));
  bubble.style.left = cx + 'px'; bubble.style.top = bottom + 'px';
}

function tween(props, ms, id){
  return new Promise(res=>{
    const from={}; for(const k in props) from[k]=H[k];
    const t0=performance.now();
    (function step(now){
      if(!alive(id)) return res();

/* walking happens on a lane in front of the furniture, so the tenant never walks "through" things */
async function walkTo(x, id, fast, sy){
  x=clamp(x,-90,570); const endY = sy ?? STAND;
  const dx=x-H.X; if (Math.abs(dx)<4 && Math.abs(H.Y-endY)<2) return;
  H.dir = dx>=0?1:-1;
  setPose(fast?'run':'walk', fast?'focused':undefined);
  const long = Math.abs(dx)>40;
  if (long && H.Y<LANE-1) await tween({Y:LANE}, 180, id);
  const speed=fast?260:150, ms=Math.max(60,Math.abs(dx)/speed*1000), t0=performance.now(), x0=H.X;
  await new Promise(res=>{ (function st(now){ if(!alive(id)) return res(); const f=Math.min(1,(now-t0)/ms); H.X=x0+dx*f; drawMiniThrottled(); if(f<1) requestAnimationFrame(st); else res(); })(performance.now()); });
  if (alive(id) && Math.abs(H.Y-endY)>1) await tween({Y:endY}, 200, id);

let miniT=0; function drawMiniThrottled(){ const n=performance.now(); if(n-miniT>120){ miniT=n; drawMini(); } }
function setRoom(r){ H.room=r; camX=H.X; const R=ROOMS[r]; $('camName').textContent=`REC · CAM ${R.cam} · ${R.name}`; fxL.innerHTML=''; clearSpawns(true); drawRoom(r); drawMini(); presenceUpdate(); }
async function standUp(id){
  if (H.inShower){ H.inShower=false; drawRoom(H.room); }
  if (H.lying){ const o=OBJ[H.lying]; H.lying=null; if(o.room===H.room) drawRoom(H.room); setPose('idle'); await tween({Y:STAND, X:o.x}, 380, id); }
  if (H.seat){ const o=OBJ[H.seat]; H.seat=null; drawRoom(H.room); setPose('idle'); await tween({Y:STAND, X:o.x}, 320, id); }
}
async function gotoRoom(room, x, id, fast, sy){
  await standUp(id);
  if (room && room!==H.room && ROOMS[room]){
    const a=ROOMS[H.room], b=ROOMS[room];
    const goRight = (b.mx>a.mx) || (b.mx===a.mx && H.X>=240);
    await walkTo(goRight? 545 : -65, id, fast, LANE); if(!alive(id)) return;
    setRoom(room);
    const horiz = b.mx!==a.mx;
    H.X = goRight ? (horiz? -65 : 545) : (horiz? 545 : -65);
    H.Y = LANE;
  }
  if (x!=null) await walkTo(x, id, fast, sy);
}

const ROOM_ALIASES = { bath:'bathroom', toilet:'bathroom', wc:'bathroom', restroom:'bathroom', lounge:'living', living_room:'living', livingroom:'living', yard:'garden', outside:'garden', backyard:'garden', bed:'bedroom', bed_room:'bedroom' };
const COLOR_NAMES = { red:'#d64545', blue:'#3f6fd1', green:'#4f9a4a', yellow:'#e6c13a', pink:'#e87aa8', purple:'#8a5ac8', orange:'#e07a32', black:'#2b2d31', white:'#eceff2', grey:'#8a9099', gray:'#8a9099', brown:'#8a5a3a', mustard:'#d9a93b', gold:'#d4a62a', teal:'#2f9a92' };
function normColor(c){ if(!c) return null; c=String(c).toLowerCase().trim(); if(/^#[0-9a-f]{6}$/.test(c)) return c; if(/^#[0-9a-f]{3}$/.test(c)) return '#'+c[1]+c[1]+c[2]+c[2]+c[3]+c[3]; return COLOR_NAMES[c]||null; }

async function runScript(steps, id){
  for (const s of steps){ if(!alive(id)) return; try { await doStep(s, id); } catch(e){ console.warn('step failed', s, e); } }
  if (!alive(id)) return;
  await sleep(600); if(!alive(id)) return;
  stopFx(); clearSpawns(false);
  if (H.hidden){ await doStep({do:'appear',room:H.room,x:240,from:H.X<240?'left':'right'}, id); if(!alive(id)) return; }
  if (H.size!==H.baseSize && !H.sizeSet) H.size=H.baseSize;
  if (H.bodyProp) setProp(H.costume==='pajamas'?'mug':null);
  if (!H.lying && !H.seat) setPose('idle'); else setFace('normal');
  if (H.zoom!==1) await tween({zoom:1}, 400, id);
  caption.textContent=tr('waiting');
  if (call && call.state==='active') setPose('phone');
}
function customPose(s){
  const frames = Array.isArray(s.frames) ? s.frames.slice(0,6).map(f=>{ const o={}; for (const k of KEYS) if (typeof f[k]==='number') o[k]= k==='y'?clamp(f[k],-120,60): (k==='sL'||k==='sR'||k==='sx')?clamp(f[k],-1,1.2): clamp(f[k],-400,400); return o; }) : [];
  if (!frames.length) return null;
  return P(frames, clamp(+s.dur||400,60,3000), {usesR:1, once:!!s.once});
}
async function doStep(s, id){
  const d=String(s.do||'').toLowerCase();
  if (d==='goto' || d==='walk' || d==='run'){
    const o=OBJ[s.object]; let room=ROOM_ALIASES[s.room]||s.room;
    if (o) room=o.room;
    const x = o ? o.x : (typeof s.x==='number' ? s.x : (room && room!==H.room ? 240 : null));
    await gotoRoom(room||H.room, x, id, d==='run'||s.run, o&&o.sy);
    return;
  }
  if (d==='act' || d==='pose'){
    stopFx();
    let pn = String(s.pose||'idle');
    let p = pn==='custom' ? customPose(s) : POSES[pn];
    if (!p){ pn='idle'; p=POSES.idle; }
    const at = OBJ[s.at];
    if (s.prop!==undefined) setProp(s.prop==='none'||s.prop===null?null:s.prop);
    if (at){
      if (at.room!==H.room || (Math.abs(H.X-at.x)>6 && H.seat!==at.id && H.lying!==at.id && !(at.id==='shower'&&H.inShower))) await gotoRoom(at.room, at.x, id, false, at.sy);
      if(!alive(id)) return;
      if (p.lie && at.lie){
        if (H.lying!==at.id){ await standUp(id); H.dir=1; setPose(p, s.face); H.lying=at.id; drawRoom(H.room); await tween({X:at.lie.x, Y:at.lie.y+HIP*BASE*H.size}, 450, id); }
      } else if (at.seat && !p.lie){
        if (H.seat!==at.id){ await standUp(id); H.seat=at.id; drawRoom(H.room); await tween({X:at.seat.x, Y:at.seat.y+HIP*BASE*H.size}, 380, id); }
      } else if (at.id==='shower'){
        if (!H.inShower){ H.inShower=true; drawRoom(H.room); }
      }
    } else if (p.lie && !H.lying){ p=POSES.liefloor; await standUp(id); H.dir=1; }
    else if (!p.lie && H.lying){ await standUp(id); }
    if(!alive(id)) return;
    setPose(p, s.face && FACES[s.face] ? s.face : undefined);
    if (String(s.pose)==='sleep' && p===POSES.liefloor){ setFace('sleep'); startFx('zzz'); }
    const fx = s.fx || p.fx; if (fx && fx!=='none') startFx(fx);

  if (d==='set'){

    else if (v==='open') st.open=true; else if (v==='closed'||v==='close') st.open=false;
    else if (v==='toggle'){ if('open' in st) st.open=!st.open; else st.on=!st.on; }

    if (o.room===H.room) drawRoom(H.room);
    drawMini();
    await sleep(350);
    return;
  }
  if (d==='lights'){ const r=ROOMS[s.room]?s.room:H.room; ST.dark[r]=!s.on; if(r===H.room) drawRoom(r); drawMini(); await sleep(400); return; }
  if (d==='costume' || d==='outfit'){
    const c = {...s}; delete c.do;

    if (c.preset && !COST[c.preset]) delete c.preset;
    if (!c.ms || c.ms>0){ for(let i=0;i<8;i++) el('circle',{cx:H.X+rnd(-34,34),cy:H.Y-rnd(10,150)*H.size,r:rnd(10,20),fill:'#eceff2',class:'poof'},null,800); }
    await sleep(220);
    applyCostume(c);
    if (c.say) say(String(c.say).slice(0,100));

    return;

  if (d==='spawn'){ spawn(s); await sleep(250); return; }
  if (d==='move'){ await moveSpawn(s, id); return; }
  if (d==='despawn' || d==='remove'){ despawn(s.id); await sleep(150); return; }
  if (d==='say'){ const t=String(s.text||s.say||'').slice(0,120); say(t); await sleep(clamp(1200+t.length*45,800,5000)); return; }
  if (d==='wait'){ await sleep(clamp(+s.ms||800,100,5000)); return; }
  if (d==='size'){ const v=clamp(+s.scale||1,.35,1.9); H.baseSize=v; await tween({size:v},600,id); return; }

  if (d==='fx'){ startFx(s.fx); await sleep(clamp(+s.ms||1500,200,6000)); stopFx(); return; }
  if (d==='exit'){ await standUp(id); await walkTo(H.X<240?-70:550,id,false,LANE); return; }

    const x0=H.X, y0=H.Y, s0=H.size;
    const tx = clamp(tgt ? tgt.x : (+s.x||H.X), -150, 630), ty = clamp(tgt ? tgt.y : (s.y??STAND), -150, 330);

    const t0=performance.now();
    await new Promise(res=>{ (function st(now){ if(!alive(id)) return res(); const f=Math.min(1,(now-t0)/ms);

{"do":"spawn","id":"name","svg":"<svg>","x":240,"y":258,"scale":1,"front":false,"anim":"none|bob|spin|wobble|pulse","stay":false} — draw ANY temporary thing in the room (animal, vehicle, monster, cake, pool…). Draw it with its base at (0,0) growing upward (negative y), roughly human-sized when scale 1 (the tenant is ~170 px tall). front:true draws it in front of the tenant. Spawned things disappear after the script unless stay:true.
{"do":"move","id":"name","x":..,"y":..,"ms":1500,"carry":true} — move a spawned thing (carry:true moves the tenant with it, e.g. riding).
{"do":"despawn","id":"name"}

{"do":"size","scale":0.4-1.9}  {"do":"face","face":"<face>"}  {"do":"fx","fx":"<fx>","ms":1500}  {"do":"flash"}  {"do":"wait","ms":800}  {"do":"say","text":"..."}

function parseSteps(text){
  if (!text) return null;
  const a=text.indexOf('{'), b=text.lastIndexOf('}'); if(a<0||b<a) return null;
  try { const j=JSON.parse(text.slice(a,b+1)); if (Array.isArray(j.steps) && j.steps.length) return j.steps.slice(0,26); } catch(e){}
  return null;
}

function deriveStatus(){
  const all=[...C.inbox,...C.outbox].filter(r=>r.status==='accepted').sort((a,b)=>(a.at||0)-(b.at||0));
  let st='single', partner=null, wedding=null;

  if (action==='breakup'){ if(!partner){ say(tr('c_nopartner')); return; } await sendRequest('breakup', partner); say(tr('c_brokeup',partner.name)); runSmall('cry'); return; }
  if (action==='propose'){ if(st!=='dating'){ say(tr('c_needdating')); return; } await sendRequest('propose', partner); say(tr('c_proposed',partner.name)); runSmall('bow'); return; }
  if (action==='wedding'){ if(st!=='engaged'){ say(tr('c_needengaged')); return; } weddingForm(partner); return; }
  if (action==='date'){
    if (partner){ say(tr('c_taken')); return; }
    const t=await lookup(numberText); if(!t){ say(tr('c_nonumber')); return; } if (t.uid===C.uid){ say(tr('self')); return; }
    await sendRequest('date', t); say(tr('c_asked',t.name)); runSmall('kiss'); return;
  }
}
function runSmall(p){ const id=++runId; runScript([{do:'act',pose:p,ms:1800}], id); }

/* ---------- UI: status bar + sheet ---------- */
function renderSocial(msg){
  const bar=$('social'); if(!bar) return;
  if (!fbReady()){ bar.innerHTML=`<span class="muted">${tr('c_notset')}</span>`; return; }
  if (!C.ready){ bar.innerHTML=`<span class="muted">${msg||tr('c_connecting')}</span>`; return; }
  const {st, partner, wedding} = deriveStatus();
  const pending = C.inbox.filter(r=>r.status==='pending').length + C.guestOf.filter(w=>w.status==='accepted' && (w.when||0)>Date.now()-7200000 && !C.seenWeddings[w.id]).length;
  const label = {single:tr('c_single'), dating:tr('c_dating',partner&&partner.name), engaged:tr('c_engaged',partner&&partner.name), married:tr('c_married',partner&&partner.name)}[st];
  bar.innerHTML = `<button type="button" id="btnInbox">📬 ${pending?`<b class="badge">${pending}</b>`:''}</button><button type="button" id="btnRel">${st==='married'?'💍':st==='engaged'?'💎':st==='dating'?'❤️':'🤍'} ${esc(label)}${wedding && st==='engaged'?' · '+tr('c_weddingon', fmtWhen(wedding.when)):''}</button>`;
  $('btnInbox').onclick=openInbox; $('btnRel').onclick=openRel;
}
function fmtWhen(t){ try { return new Date(t).toLocaleString(LANG==='it'?'it-IT':'en-GB',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); } catch(e){ return ''; } }
function sheet(html){ $('sheetBody').innerHTML=html; $('sheet').classList.add('show'); }
function closeSheet(){ $('sheet').classList.remove('show'); if (window.focusCmd) focusCmd(); }
function openRel(){
  const {st, partner} = deriveStatus();
  let h=`<h3>${tr('c_rel')}</h3>`;
  if (st==='single'){
    h+=`<p>${tr('c_askhint')}</p><div class="row"><input id="relNum" placeholder="${tr('c_numph')}"><button id="relAsk">❤️ ${tr('c_ask')}</button></div>`;
  } else {
    h+=`<p><b>${esc({dating:tr('c_dating',partner.name),engaged:tr('c_engaged',partner.name),married:tr('c_married',partner.name)}[st])}</b> (${esc(partner.name)} ${esc(partner.code||'')})</p><div class="col">`;
    if (st==='dating') h+=`<button id="relPropose">💎 ${tr('c_propose')}</button>`;
    if (st==='engaged') h+=`<button id="relWedding">💒 ${tr('c_plan')}</button>`;
    h+=`<button class="ghost" id="relBreak">💔 ${st==='married'?tr('c_divorce'):tr('c_breakup')}</button></div>`;
  }
  h+=`<button class="ghost close" id="shClose">${tr('c_close')}</button>`;

  if (b('relWedding')) b('relWedding').onclick=()=>socialAction('wedding');
  if (b('relBreak')) b('relBreak').onclick=()=>{ if (confirmTwice(b('relBreak'))) { socialAction('breakup'); closeSheet(); } };

}
function confirmTwice(btn){ if (btn.dataset.sure) return true; btn.dataset.sure='1'; btn.textContent=tr('c_sure'); return false; }
function weddingForm(partner){
  const d=new Date(Date.now()+15*60000); const pad=x=>String(x).padStart(2,'0');
  const v=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  sheet(`<h3>💒 ${tr('c_plan')}</h3><p>${tr('c_planhint', partner.name)}</p>
    <label class="fl">${tr('c_when')}<input type="datetime-local" id="wWhen" value="${v}"></label>
    <label class="fl">${tr('c_guests')}<input id="wGuests" placeholder="Marco 123, Anna 555"></label>
    <div class="col"><button id="wSend">💌 ${tr('c_sendinv')}</button><button class="ghost" id="shClose">${tr('c_close')}</button></div>`);
  $('shClose').onclick=closeSheet;
  $('wSend').onclick=async()=>{
    const when=new Date($('wWhen').value).getTime()||Date.now()+60000;
    const parts=$('wGuests').value.split(',').map(s=>s.trim()).filter(Boolean).slice(0,12);
    const guests=[], names=[], missing=[];
    for (const p of parts){ const g=await lookup(p); if(g && g.uid!==C.uid && g.uid!==partner.uid){ guests.push(g.uid); names.push(g.name); } else missing.push(p); }
    await sendRequest('wedding', partner, {when, guests, guestNames:names});
    closeSheet(); say(tr('c_invsent')+(missing.length?' '+tr('c_missing',missing.join(', ')):''), 4500); runSmall('cheer');
  };
}
function openInbox(){
  const rows=[];
  for (const r of C.inbox.filter(r=>r.status==='pending').sort((a,b)=>b.at-a.at)){
    rows.push(`<div class="req"><div>${esc(tr('c_req_'+r.type, r.fromName+' '+r.fromCode))}${r.type==='wedding'?`<br><small>${fmtWhen(r.when)}${r.guestNames&&r.guestNames.length?' · '+tr('c_guestlist')+': '+esc(r.guestNames.join(', ')):''}</small>`:''}</div><div class="btns"><button data-ok="${r.id}">✔︎</button><button class="ghost" data-no="${r.id}">✕</button></div></div>`);
  }
  for (const w of C.guestOf.filter(w=>w.status==='accepted' && (w.when||0)>Date.now()-7200000)){
    rows.push(`<div class="req"><div>💌 ${esc(tr('c_invite', w.fromName+' & '+w.toName))}<br><small>${fmtWhen(w.when)}</small></div>${(w.when||0)<=Date.now()?`<div class="btns"><button data-watch="${w.id}">▶︎</button></div>`:''}</div>`);
  }
  for (const r of C.outbox.filter(r=>r.status==='declined' && Date.now()-(r.at||0)<86400000)) rows.push(`<div class="req"><div class="muted">${esc(tr('c_declinedby', r.toName))}</div></div>`);
  sheet(`<h3>📬 ${tr('c_inbox')}</h3>${rows.length?rows.join(''):`<p class="muted">${tr('c_empty')}</p>`}<button class="ghost close" id="shClose">${tr('c_close')}</button>`);
  $('shClose').onclick=closeSheet;
  $('sheetBody').querySelectorAll('[data-ok]').forEach(b=>b.onclick=async()=>{ const r=C.inbox.find(x=>x.id===b.dataset.ok); if(r){ await answerRequest(r,true); celebrate(r); } closeSheet(); });
  $('sheetBody').querySelectorAll('[data-no]').forEach(b=>b.onclick=async()=>{ const r=C.inbox.find(x=>x.id===b.dataset.no); if(r) await answerRequest(r,false); closeSheet(); });
  $('sheetBody').querySelectorAll('[data-watch]').forEach(b=>b.onclick=()=>{ const w=C.guestOf.find(x=>x.id===b.dataset.watch); closeSheet(); if(w) playCeremony(w); });
}
function celebrate(r){
  const id=++runId;
  if (r.type==='date') runScript([{do:'act',pose:'kiss',ms:2200,say:LANG==='it'?'Sì! Ci sto.':'Yes! Count me in.'}], id);
  if (r.type==='propose') runScript([{do:'act',pose:'cheer',ms:2500,say:LANG==='it'?'Sì, lo voglio!':'Yes, I will!'}], id);
  if (r.type==='wedding') runScript([{do:'act',pose:'hug',ms:2200,say:LANG==='it'?'Ci sposiamo!':'We\'re getting married!'}], id);
}

/* ---------- the wedding ceremony (for the couple and the guests) ---------- */
let ceremonyOn=false;
function checkWeddings(){
  if (!C.ready || ceremonyOn) return;
  const mine=[...C.inbox,...C.outbox].filter(r=>r.type==='wedding'&&r.status==='accepted');
  const all=[...mine, ...C.guestOf.filter(r=>r.status==='accepted')];
  for (const w of all){
    if (C.seenWeddings[w.id]) continue;
    if ((w.when||0)<=Date.now() && Date.now()-(w.when||0)<7200000){ playCeremony(w); return; }
  }
}
async function playCeremony(w){
  if (ceremonyOn) return; ceremonyOn=true;
  C.seenWeddings[w.id]=1; try{ localStorage.setItem('subservientSeen', JSON.stringify(C.seenWeddings)); }catch(e){}
  const id=++runId; stopFx(); clearSpawns(true);
  const iAmSpouse = w.from===C.uid || w.to===C.uid;
  const temp=[];
  try {
    await gotoRoom('garden', 240, id); if(!alive(id)) return;
    caption.textContent = '💒 '+tr('c_weddingof', w.fromName+' & '+w.toName);
    spawn({id:'arch', x:240, y:STAND-4, svg:`<path d="M-46 0 L-46 -120 Q0 -175 46 -120 L46 0" fill="none" stroke="#fff" stroke-width="7"/><g fill="#ff9fb8">${Array.from({length:14},(_,i)=>{const a=Math.PI*(i/13); return `<circle cx="${Math.cos(a)*-46}" cy="${-120-Math.sin(a)*48}" r="6"/>`;}).join('')}</g><g fill="#fff">${Array.from({length:8},(_,i)=>`<circle cx="${i<4?-46:46}" cy="${-20-(i%4)*28}" r="5"/>`).join('')}</g>`, stay:true});
    let A, B;   // A = left spouse, B = right spouse
    const outfits = k => k==='f' ? {outfit:'#f7f7f2', pants:'#f7f7f2', hat:`<path d="M-17 -34 Q0 -44 17 -34 L22 10 Q0 4 -22 10 Z" fill="#fff" opacity=".55"/><g fill="#ff9fb8"><circle cx="-8" cy="-38" r="3"/><circle cx="0" cy="-41" r="3"/><circle cx="8" cy="-38" r="3"/></g>`} : {outfit:'#2b2f3a', pants:'#2b2f3a', torso:`<path d="M-7 -42 L0 -22 L7 -42 Z" fill="#fff"/><path d="M-4 -41 L0 -38 L4 -41 L4 -36 L0 -38 L-4 -36 Z" fill="#222"/>`};
    if (iAmSpouse){
      const myk=H.kind, other = w.from===C.uid ? {name:w.toName,kind:w.toKind||'f'} : {name:w.fromName,kind:w.fromKind||'m'};
      const o=outfits(myk); applyCostume({preset:'pajamas', outfit:o.outfit, pants:o.pants, hat:o.hat||'', torso:o.torso||''});
      await walkTo(212, id); H.dir=1;
      if (C.partnerNPC){ C.partnerNPC.busy=true; C.partnerNPC.room='garden'; C.partnerNPC.X=268; B=C.partnerNPC; }
      else { B=makeNPC({name:other.name, kind:other.kind, room:'garden', x:268}); temp.push(B); }
      const ob=outfits(B.kind); dressNPC(B, ob.outfit, ob.pants); costumeNPC(B, ob.hat, ob.torso); B.dir=-1; npcPose(B,'idle','happy');
    } else {
      const ka=w.fromKind||'m', kb=w.toKind||'f';
      A=makeNPC({name:w.fromName, kind:ka, room:'garden', x:212}); B=makeNPC({name:w.toName, kind:kb, room:'garden', x:268}); temp.push(A,B);
      const oa=outfits(ka), ob=outfits(kb); dressNPC(A,oa.outfit,oa.pants); costumeNPC(A,oa.hat,oa.torso); dressNPC(B,ob.outfit,ob.pants); costumeNPC(B,ob.hat,ob.torso);
      A.dir=1; B.dir=-1; npcPose(A,'idle','happy'); npcPose(B,'idle','happy');
      await walkTo(90, id); H.dir=1;
    }
    // guests (names from the invitation)
    const gn=(w.guestNames||[]).slice(0,8); const slots=[60,110,160,320,370,420,95,385];
    gn.forEach((name,i)=>{ if (!iAmSpouse && name===H.name) return; const g=makeNPC({name, kind:i%2?'f':'m', room:'garden', x:slots[i], y:STAND+16, outfit:['#3f6fd1','#c86ba8','#4f9a4a','#e07a32','#8a5ac8','#2f9a92','#d64545','#d4a62a'][i]}); g.dir = slots[i]<240?1:-1; temp.push(g); });
    await sleep(800); if(!alive(id)) return;
    const vow = LANG==='it'?'Sì, lo voglio.':'I do.';
    if (iAmSpouse){ setPose('idle','love'); say(vow,2200); await sleep(2300); npcSay(B, vow); npcFace(B,'love'); await sleep(2300); }
    else { npcSay(A, vow); npcFace(A,'love'); await sleep(2300); npcSay(B, vow); npcFace(B,'love'); await sleep(2300); }
    if(!alive(id)) return;
    if (iAmSpouse){ setPose('kiss'); npcPose(B,'kiss','kissy'); } else { npcPose(A,'kiss','kissy'); npcPose(B,'kiss','kissy'); setPose('clap'); }
    startFx('hearts'); startFx('confetti');
    temp.forEach(g=>{ if(g!==A && g!==B) npcPose(g, Math.random()<.5?'clap':'cheer'); });
    await sleep(3500); stopFx();
    if (iAmSpouse){ say(LANG==='it'?'Sposati. Ufficialmente.':'Married. Officially.',2500); await sleep(2600); }
    else { setPose('cheer'); await sleep(2000); }
  } finally {
    temp.forEach(removeNPC); despawn('arch');
    if (C.partnerNPC){ C.partnerNPC.busy=false; costumeNPC(C.partnerNPC,'',''); dressNPC(C.partnerNPC, C.partner&&C.partner.outfit); }
    ceremonyOn=false; recompute();
    if (alive(id)){ setPose('idle'); caption.textContent=tr('waiting'); }
  }
}

/* partner step for AI scripts */
async function partnerStep(s, id){
  const n=C.partnerNPC; if(!n) return;
  n.busy=true; if (n.room!==H.room){ n.room=H.room; n.X = H.X<240 ? 470 : 10; }
  const tx = typeof s.x==='number' ? clamp(s.x,20,460) : clamp(H.X + (H.X<240?55:-55), 20, 460);
  await npcWalk(n, tx, id); n.dir = H.X>n.X?1:-1;
  if (s.pose) npcPose(n, s.pose, s.face);
  if (s.say) npcSay(n, s.say);
  await sleep(clamp(+s.ms||1500, 300, 6000));
  n.busy=false;
}

try { const l=localStorage.getItem('subservientLang'); if (l==='it'||l==='en') LANG=l; } catch(e){}
function tr(k, a){ const v=(I18N[LANG]||I18N.en)[k] ?? I18N.en[k]; return typeof v==='function' ? v(a) : v; }
function applyLang(){
  document.documentElement.lang=LANG;
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=tr(e.dataset.i));
  document.querySelectorAll('[data-ip]').forEach(e=>e.placeholder=tr(e.dataset.ip));
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===LANG));
  $('cmd').placeholder=tr('ph',H.name);
  if (H.code && $('mynum')) showNumber();
  if (typeof renderSocial==='function') renderSocial();
  const c=caption.textContent; if (!c || c===I18N.en.start||c===I18N.it.start) caption.textContent=tr('start'); else if (c===I18N.en.waiting||c===I18N.it.waiting) caption.textContent=tr('waiting');
}
document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>{ LANG=b.dataset.l; try{ localStorage.setItem('subservientLang',LANG); }catch(e){} applyLang(); if (window.focusCmd) focusCmd(); }));
applyLang();

/* ================= KEYBOARD-FRIENDLY LAYOUT =================
   The page always fits the visible area (above the on-screen keyboard), and the command box keeps focus so the keyboard stays open. */
(function(){
  // same layout with or without the keyboard: camera on top (whole room), command box right under it.
  // The page never scrolls, and the command box grabs focus back so the keyboard stays up.
  const cmdEl=$('cmd');
  const ready=()=>$('setup').classList.contains('hide');
  const keepTop=()=>{ if (window.scrollY || document.documentElement.scrollTop || document.body.scrollTop){ window.scrollTo(0,0); document.documentElement.scrollTop=0; document.body.scrollTop=0; } };
  window.addEventListener('scroll',keepTop,{passive:true});
  if (window.visualViewport){ const vv=window.visualViewport; const unpan=()=>{ if (vv.offsetLeft||vv.offsetTop) window.scrollTo(0,0); }; vv.addEventListener('scroll',unpan); vv.addEventListener('resize',unpan); }
  if (window.visualViewport){ window.visualViewport.addEventListener('resize',keepTop); window.visualViewport.addEventListener('scroll',keepTop); }
  cmdEl.addEventListener('focus',()=>{ keepTop(); setTimeout(keepTop,50); setTimeout(keepTop,300); });
  window.focusCmd=()=>{ if (ready()) { try { cmdEl.focus({preventScroll:true}); } catch(e){ cmdEl.focus(); } keepTop(); } };
  cmdEl.addEventListener('blur',()=>setTimeout(()=>{ const a=document.activeElement; if (ready() && (!a || a===document.body || a===cmdEl) && !$('callbox').contains(a)) focusCmd(); },0));
  // buttons must not steal focus from the command box: otherwise the keyboard re-opens mid-tap and the tap is lost
  document.querySelectorAll('#go, #chatF button').forEach(b=>{
    b.addEventListener('pointerdown', e=>e.preventDefault());
    b.addEventListener('mousedown', e=>e.preventDefault());
    b.addEventListener('touchstart', e=>{ e.preventDefault(); const f=b.closest('form'); if (f){ if (f.requestSubmit) f.requestSubmit(); else f.dispatchEvent(new Event('submit',{cancelable:true})); } }, {passive:false});
  });
  document.addEventListener('pointerdown',e=>{ if (!ready()) return; if (e.target.closest('input,button,label,#callbox,.incoming,.mynum')) return; e.preventDefault(); focusCmd(); });
})();
